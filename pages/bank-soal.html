<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bank Soal - Ulangan Digital</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="stylesheet" href="../css/style.css?v=2.2"/>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/storage.js?v=2.2"></script>
<script src="../js/utils.js?v=2.2"></script>
<script src="../js/auth.js?v=2.2"></script>
<script src="../js/layout.js?v=2.2"></script>
<script>
DB.init();
Auth.init();
const session = Layout.initStaff('bank-soal', ['guru', 'admin']);

const myMapels = DB.getGuruMapels(session);
const myKelas = DB.getGuruKelas(session);

let filterTipe = 'semua';
let filterMapel = (session.role === 'guru' && myMapels.length > 0) ? myMapels[0] : 'semua';
let filterKelas = 'semua';
let searchQuery = '';
let editingSoalId = null;

try {
  if (session) renderBankSoal();
} catch (err) {
  console.error('Error rendering Bank Soal:', err);
  Layout.setContent(`
    <div class="alert alert-danger" style="margin:24px">
      <span class="alert-icon">❌</span>
      <div><strong>Gagal memuat Bank Soal:</strong> ${Utils.escapeHtml(err.message)}</div>
    </div>
  `);
}

// Sinkronkan data bank soal terbaru dari Supabase Cloud
if (DB.client) {
  DB.syncFromSupabase().then(() => {
    if (session) renderSoalList();
  });
}
window.addEventListener('supabase-synced', () => {
  if (session) renderSoalList();
});

function renderBankSoal() {
  Layout.setPageTitle('Bank Soal');
  const allSoal = DB.getSoal();
  // Kumpulkan daftar mapel dan kelas dari bank soal & profil guru
  const availableMapels = [...new Set([...myMapels, ...allSoal.map(s => s.mapel).filter(Boolean)])];
  const availableKelas = [...new Set([...myKelas, ...allSoal.map(s => s.kelas).filter(Boolean)])];

  const content = `
  <div class="animate-fade-in">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="page-title">Bank Soal</h1>
        <p class="page-subtitle">
          ${session.role === 'guru'
            ? `Mapel Anda: <strong style="color:var(--primary)">${myMapels.join(', ') || 'Semua'}</strong> • Kelas: <strong>${myKelas.join(', ') || 'Semua'}</strong>`
            : 'Kelola kumpulan soal untuk ujian (Akses Administrator)'}
        </p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="openImportSoalModal()" class="btn btn-outline" style="background:white;border-color:var(--primary);color:var(--primary);display:flex;align-items:center;gap:6px">
          <span>📥</span> Import Soal (Excel / CSV)
        </button>
        <button onclick="openSoalModal()" class="btn btn-primary">➕ Tambah Soal</button>
      </div>
    </div>

    <!-- Filter & Search -->
    <div class="card mb-4">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <div class="input-wrapper" style="flex:1;min-width:200px">
          <span class="input-icon">🔍</span>
          <input type="text" id="search-soal" class="form-control" placeholder="Cari pertanyaan, bab..." oninput="searchQuery=this.value;renderSoalList()"/>
        </div>
        <div>
          <select class="form-control" style="width:auto;min-width:160px" onchange="filterMapel=this.value;renderSoalList()">
            <option value="semua" ${filterMapel==='semua'?'selected':''}>Semua Mapel</option>
            ${availableMapels.map(m => {
              const isMine = myMapels.some(item => item.toLowerCase() === m.toLowerCase());
              return `<option value="${Utils.escapeHtml(m)}" ${filterMapel.toLowerCase()===m.toLowerCase()?'selected':''}>${isMine ? '★ ' : ''}${Utils.escapeHtml(m)}</option>`;
            }).join('')}
          </select>
        </div>
        <div>
          <select class="form-control" style="width:auto;min-width:130px" onchange="filterKelas=this.value;renderSoalList()">
            <option value="semua" ${filterKelas==='semua'?'selected':''}>Semua Kelas</option>
            ${availableKelas.map(k => {
              const isMine = myKelas.some(item => item.toLowerCase() === k.toLowerCase());
              return `<option value="${Utils.escapeHtml(k)}" ${filterKelas.toLowerCase()===k.toLowerCase()?'selected':''}>${isMine ? '★ ' : ''}Kelas ${Utils.escapeHtml(k)}</option>`;
            }).join('')}
          </select>
        </div>
      </div>
      <div class="question-type-tabs mt-4">
        ${[
          {id:'semua',label:'📋 Semua'},
          {id:'pg',label:'🔘 Pilihan Ganda'},
          {id:'bs',label:'✅ Benar/Salah'},
          {id:'isian',label:'✏️ Isian'},
          {id:'uraian',label:'📝 Uraian'},
        ].map(t => `<button class="q-type-btn ${filterTipe===t.id?'active':''}" onclick="filterTipe='${t.id}';renderSoalList();document.querySelectorAll('.q-type-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${t.label}</button>`).join('')}
      </div>
    </div>

    <div id="soal-list-container"></div>
  </div>
  
  <!-- Modal Soal -->
  <div id="modal-soal" class="modal-backdrop" style="display:none">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-soal-title">Tambah Soal Baru</h3>
        <button class="modal-close" onclick="closeSoalModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-soal-body">
      </div>
    </div>
  </div>

  <!-- Modal Import Soal (Excel / CSV) -->
  <div id="modal-import-soal" class="modal-backdrop" style="display:none">
    <div class="modal modal-lg" style="max-width:920px">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:24px">📥</span>
          <div>
            <h3 class="modal-title" style="margin:0">Import Bank Soal (Excel / CSV)</h3>
            <div style="font-size:12px;color:var(--gray-500)">Tambah puluhan hingga ratusan soal sekaligus dalam satu kali upload</div>
          </div>
        </div>
        <button class="modal-close" onclick="closeImportSoalModal()">✕</button>
      </div>
      <div class="modal-body" style="max-height:78vh;overflow-y:auto">
        <!-- Step 1: Download Template -->
        <div class="alert alert-info" style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <div style="font-weight:700;color:var(--primary-dark);font-size:14px">💡 Belum memiliki format file soal?</div>
            <div style="font-size:12px;color:var(--gray-600)">Unduh template resmi yang sudah terformat rapi untuk PG, Benar/Salah, Isian, dan Uraian:</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" onclick="downloadTemplateExcelSoal()" class="btn btn-sm btn-primary">📥 Unduh Template Excel (.xlsx)</button>
            <button type="button" onclick="downloadTemplateCSVSoal()" class="btn btn-sm btn-outline">📄 Unduh Template CSV</button>
          </div>
        </div>

        <!-- Default Settings (Fallback) -->
        <div style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px">
          <div style="font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:8px">⚙️ Pengaturan Default (Digunakan jika kolom di file kosong):</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:12px">
            <div>
              <label class="form-label" style="font-size:12px">Mata Pelajaran Default</label>
              <input type="text" id="import-default-mapel" class="form-control form-control-sm" value="${Utils.escapeHtml(myMapels[0] || 'Umum')}" placeholder="e.g. Matematika"/>
            </div>
            <div>
              <label class="form-label" style="font-size:12px">Kelas Default</label>
              <input type="text" id="import-default-kelas" class="form-control form-control-sm" value="${Utils.escapeHtml(myKelas[0] || 'Semua')}" placeholder="e.g. XI IPA 1"/>
            </div>
          </div>
        </div>

        <!-- Step 2: Upload Dropzone -->
        <div id="drop-zone-soal" style="border:2px dashed var(--primary);border-radius:var(--radius);padding:32px 20px;text-align:center;background:#F8FAFC;cursor:pointer;transition:all 0.2s" onclick="document.getElementById('file-input-soal').click()" ondragover="handleSoalDragOver(event)" ondragleave="handleSoalDragLeave(event)" ondrop="handleSoalDrop(event)">
          <div style="font-size:38px;margin-bottom:8px">📂</div>
          <div style="font-size:15px;font-weight:700;color:var(--gray-800)">Klik untuk pilih file Excel / CSV, atau seret file ke sini</div>
          <div style="font-size:12px;color:var(--gray-500);margin-top:4px">Mendukung format spreadsheet <strong>.xlsx, .xls, .csv</strong> (Maksimal 10 MB)</div>
          <input type="file" id="file-input-soal" accept=".xlsx, .xls, .csv" style="display:none" onchange="handleSoalFileSelect(event)" />
        </div>

        <!-- Step 3: Preview Container -->
        <div id="import-soal-preview-container" style="display:none;margin-top:20px">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:18px">📊</span>
              <span id="import-soal-summary-text" style="font-weight:700;font-size:14px;color:var(--gray-800)">0 Soal Terdeteksi</span>
              <span id="import-soal-file-badge" class="badge badge-primary">soal.xlsx</span>
            </div>
            <button type="button" onclick="resetImportSoalFile()" class="btn btn-sm btn-ghost" style="color:var(--danger)">✕ Ganti File</button>
          </div>

          <!-- Breakdown pills -->
          <div id="import-soal-breakdown" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>

          <!-- Preview Table -->
          <div style="max-height:280px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:var(--radius)">
            <table class="table" style="font-size:12px;margin:0">
              <thead style="position:sticky;top:0;background:var(--gray-100);z-index:2">
                <tr>
                  <th style="width:36px">#</th>
                  <th style="width:70px">Tipe</th>
                  <th>Pertanyaan</th>
                  <th style="width:120px">Pilihan / Kunci</th>
                  <th style="width:60px">Bobot</th>
                  <th style="width:100px">Status</th>
                </tr>
              </thead>
              <tbody id="import-soal-preview-tbody"></tbody>
            </table>
          </div>

          <!-- Upload Progress Bar -->
          <div id="import-soal-progress-container" style="display:none;margin-top:16px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
              <span id="import-soal-progress-text">Menyimpan soal ke database...</span>
              <span id="import-soal-progress-percent">0%</span>
            </div>
            <div style="height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden">
              <div id="import-soal-progress-bar" style="height:100%;width:0%;background:var(--primary);transition:width 0.2s"></div>
            </div>
          </div>

          <div class="modal-footer" style="padding:16px 0 0;border:none;margin-top:16px;display:flex;justify-content:flex-end;gap:10px">
            <button type="button" onclick="closeImportSoalModal()" class="btn btn-secondary">Batal</button>
            <button type="button" id="btn-submit-import-soal" onclick="executeImportSoal()" class="btn btn-primary">🚀 Impor Sekarang</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  Layout.setContent(content);
  renderSoalList();
}

function renderSoalList() {
  let list = DB.getSoal().filter(s => {
    if (!s) return false;
    if (session.role === 'admin') return true;
    // Guru hanya melihat soal mapel & kelas ampuan atau buatannya
    return DB.isGuruMatch(session, s.mapel, s.kelas) || s.pembuatId === session.userId;
  });

  if (filterTipe !== 'semua') list = list.filter(s => s.tipe === filterTipe);
  if (filterMapel !== 'semua') list = list.filter(s => (s.mapel || '').toLowerCase() === filterMapel.toLowerCase());
  if (filterKelas !== 'semua') list = list.filter(s => (s.kelas || '').toLowerCase().includes(filterKelas.toLowerCase()));
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    list = list.filter(s => s.pertanyaan?.toLowerCase().includes(q) || s.bab?.toLowerCase().includes(q));
  }

  const container = document.getElementById('soal-list-container');
  if (!container) return;

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div class="empty-state-title">Belum ada soal untuk kriteria ini</div>
        <div class="empty-state-text">Klik "Tambah Soal" untuk membuat soal baru untuk mata pelajaran ini</div>
      </div>`;
    return;
  }

  const tipeBadge = {pg:'🔘 PG', bs:'✅ B/S', isian:'✏️ Isian', uraian:'📝 Uraian'};
  const tingkatColor = {mudah:'badge-success', sedang:'badge-warning', sulit:'badge-danger'};

  container.innerHTML = `
    <div style="margin-bottom:12px;color:var(--gray-500);font-size:13px">${list.length} soal ditemukan</div>
    ${list.map((s,i) => `
    <div class="soal-card">
      <div class="soal-card-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13px;font-weight:700;color:var(--gray-400)">#${i+1}</span>
          <span class="badge badge-primary">${tipeBadge[s.tipe] || s.tipe}</span>
          <span class="badge ${tingkatColor[s.tingkat] || 'badge-gray'}">${s.tingkat || '-'}</span>
        </div>
        <div style="display:flex;gap:6px">
          <button onclick="openSoalModal('${s.id}')" class="btn btn-sm btn-outline">✏️ Edit</button>
          <button onclick="hapusSoal('${s.id}')" class="btn btn-sm btn-danger">🗑️</button>
        </div>
      </div>
      <div class="soal-text">${Utils.escapeHtml(s.pertanyaan)}</div>
      <div class="soal-meta">
        <span class="badge badge-gray">📚 ${Utils.escapeHtml(s.mapel||'-')}</span>
        ${s.kelas ? `<span class="badge badge-gray">👥 Kelas: ${Utils.escapeHtml(s.kelas)}</span>` : ''}
        <span class="badge badge-gray">📖 ${Utils.escapeHtml(s.bab||'-')}</span>
        <span class="badge badge-gray">🎯 Bobot: ${s.bobot||1}</span>
        ${s.tipe==='pg' ? `<span class="badge badge-info">Kunci: ${s.jawaban}</span>` : ''}
      </div>
      ${s.tipe==='pg' && s.pilihan ? `
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
        ${s.pilihan.map((p,pi) => `
          <span style="padding:4px 10px;border-radius:6px;font-size:12px;background:${s.jawaban===String.fromCharCode(65+pi)?'var(--primary-pale)':'var(--gray-50)'};border:1px solid ${s.jawaban===String.fromCharCode(65+pi)?'var(--primary)':'var(--gray-200)'};color:${s.jawaban===String.fromCharCode(65+pi)?'var(--primary)':'var(--gray-600)'}">
            ${String.fromCharCode(65+pi)}. ${Utils.escapeHtml(p)}
          </span>`).join('')}
      </div>` : ''}
    </div>`).join('')}`;
}

function openSoalModal(id = null) {
  editingSoalId = id;
  const existing = id ? DB.getSoalById(id) : null;
  document.getElementById('modal-soal-title').textContent = id ? 'Edit Soal' : 'Tambah Soal Baru';
  document.getElementById('modal-soal-body').innerHTML = buildSoalForm(existing);
  document.getElementById('modal-soal').style.display = 'flex';
}

function closeSoalModal() {
  document.getElementById('modal-soal').style.display = 'none';
  editingSoalId = null;
}

function buildSoalForm(soal) {
  const tipe = soal?.tipe || 'pg';
  const defaultMapel = soal?.mapel || (filterMapel !== 'semua' ? filterMapel : (myMapels[0] || ''));
  const defaultKelas = soal?.kelas || (filterKelas !== 'semua' ? filterKelas : (myKelas[0] || ''));

  return `
    <form onsubmit="saveSoal(event)" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tipe Soal <span class="required">*</span></label>
          <select id="soal-tipe" class="form-control" onchange="updateSoalForm(this.value)">
            <option value="pg" ${tipe==='pg'?'selected':''}>Pilihan Ganda</option>
            <option value="bs" ${tipe==='bs'?'selected':''}>Benar / Salah</option>
            <option value="isian" ${tipe==='isian'?'selected':''}>Isian Singkat</option>
            <option value="uraian" ${tipe==='uraian'?'selected':''}>Uraian</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Mata Pelajaran <span class="required">*</span></label>
          ${myMapels.length > 0 ? `
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">
            ${myMapels.map(m => `<button type="button" class="btn btn-ghost btn-xs" style="border:1px solid var(--gray-300);padding:1px 6px;font-size:10px" onclick="document.getElementById('soal-mapel').value='${m}'">${m}</button>`).join('')}
          </div>` : ''}
          <input type="text" id="soal-mapel" class="form-control" value="${Utils.escapeHtml(defaultMapel)}" placeholder="e.g. Matematika" maxlength="50"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Kelas</label>
          ${myKelas.length > 0 ? `
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">
            ${myKelas.map(k => `<button type="button" class="btn btn-ghost btn-xs" style="border:1px solid var(--gray-300);padding:1px 6px;font-size:10px" onclick="document.getElementById('soal-kelas').value='${k}'">${k}</button>`).join('')}
          </div>` : ''}
          <input type="text" id="soal-kelas" class="form-control" value="${Utils.escapeHtml(defaultKelas)}" placeholder="e.g. XI / 8A" maxlength="20"/>
        </div>
        <div class="form-group">
          <label class="form-label">Bab / Topik</label>
          <input type="text" id="soal-bab" class="form-control" value="${Utils.escapeHtml(soal?.bab||'')}" placeholder="e.g. Aljabar" maxlength="100"/>
        </div>
        <div class="form-group">
          <label class="form-label">Tingkat Kesulitan</label>
          <select id="soal-tingkat" class="form-control">
            <option value="mudah" ${soal?.tingkat==='mudah'?'selected':''}>Mudah</option>
            <option value="sedang" ${soal?.tingkat==='sedang'?'selected':''}>Sedang</option>
            <option value="sulit" ${soal?.tingkat==='sulit'?'selected':''}>Sulit</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Bobot Nilai</label>
          <input type="number" id="soal-bobot" class="form-control" value="${soal?.bobot||1}" min="1" max="100"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Pertanyaan / Soal <span class="required">*</span></label>
        <textarea id="soal-pertanyaan" class="form-control" rows="3" placeholder="Tulis soal di sini..." maxlength="2000">${Utils.escapeHtml(soal?.pertanyaan||'')}</textarea>
      </div>
      
      <!-- Dynamic answer section -->
      <div id="soal-jawaban-section">
        ${buildJawabanSection(soal, tipe)}
      </div>

      <div class="modal-footer" style="padding:0;border:none;margin-top:16px">
        <button type="button" onclick="closeSoalModal()" class="btn btn-secondary">Batal</button>
        <button type="submit" class="btn btn-primary">💾 Simpan Soal</button>
      </div>
    </form>`;
}

function buildJawabanSection(soal, targetTipe) {
  const tipe = targetTipe || (document.getElementById('soal-tipe')?.value) || soal?.tipe || 'pg';
  
  if (tipe === 'pg') {
    const pilihanArr = soal?.pilihan?.length === 5 ? soal.pilihan : ['','','','',''];
    return `
      <div class="form-group">
        <label class="form-label">Pilihan Jawaban <span class="required">*</span></label>
        ${pilihanArr.map((p,i) => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="width:28px;height:28px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${String.fromCharCode(65+i)}</span>
          <input type="text" id="pilihan-${i}" class="form-control" value="${Utils.escapeHtml(p)}" placeholder="Pilihan ${String.fromCharCode(65+i)}" maxlength="500"/>
        </div>`).join('')}
      </div>
      <div class="form-group">
        <label class="form-label">Kunci Jawaban <span class="required">*</span></label>
        <select id="soal-kunci" class="form-control">
          ${['A','B','C','D','E'].map(k => `<option value="${k}" ${soal?.jawaban===k?'selected':''}>${k}</option>`).join('')}
        </select>
      </div>`;
  } else if (tipe === 'bs') {
    return `
      <div class="form-group">
        <label class="form-label">Kunci Jawaban <span class="required">*</span></label>
        <select id="soal-kunci" class="form-control">
          <option value="Benar" ${soal?.jawaban==='Benar'?'selected':''}>✅ Benar</option>
          <option value="Salah" ${soal?.jawaban==='Salah'?'selected':''}>❌ Salah</option>
        </select>
      </div>`;
  } else if (tipe === 'isian') {
    return `
      <div class="form-group">
        <label class="form-label">Kunci Jawaban <span class="required">*</span></label>
        <input type="text" id="soal-kunci" class="form-control" value="${Utils.escapeHtml(soal?.jawaban||'')}" placeholder="Jawaban yang benar" maxlength="500"/>
        <div class="form-hint">Pengecekan tidak case-sensitive</div>
      </div>`;
  } else if (tipe === 'uraian') {
    return `
      <div class="form-group">
        <label class="form-label">Pedoman Penilaian / Kunci Jawaban</label>
        <textarea id="soal-kunci" class="form-control" rows="3" placeholder="Masukkan pedoman penilaian..." maxlength="2000">${Utils.escapeHtml(soal?.jawaban||'')}</textarea>
        <div class="form-hint">Uraian perlu dinilai manual oleh guru</div>
      </div>`;
  }
  return '';
}

function updateSoalForm(tipe) {

function saveSoal(e) {
  e.preventDefault();
  Utils.clearFieldErrors();
  
  const tipe = document.getElementById('soal-tipe').value;
  const pertanyaan = Utils.sanitizeInput(document.getElementById('soal-pertanyaan').value);
  const mapel = Utils.sanitizeInput(document.getElementById('soal-mapel').value);
  
  if (!pertanyaan) { Utils.toast('Pertanyaan wajib diisi', 'error'); return; }
  if (!mapel) { Utils.toast('Mata pelajaran wajib diisi', 'error'); return; }

  const soalData = {
    tipe,
    mapel,
    kelas: Utils.sanitizeInput(document.getElementById('soal-kelas').value),
    bab: Utils.sanitizeInput(document.getElementById('soal-bab').value),
    tingkat: document.getElementById('soal-tingkat').value,
    bobot: parseInt(document.getElementById('soal-bobot').value) || 1,
    pertanyaan,
    pembuatId: session.userId,
  };

  if (tipe === 'pg') {
    const pilihan = [0,1,2,3,4].map(i => Utils.sanitizeInput(document.getElementById(`pilihan-${i}`).value));
    if (pilihan.some(p => !p.trim())) { Utils.toast('Semua pilihan jawaban wajib diisi', 'error'); return; }
    soalData.pilihan = pilihan;
    soalData.jawaban = document.getElementById('soal-kunci').value;
  } else {
    const kunci = document.getElementById('soal-kunci');
    soalData.jawaban = kunci ? Utils.sanitizeInput(kunci.value) : '';
  }

  if (editingSoalId) {
    DB.updateSoal(editingSoalId, soalData);
    Utils.toast('Soal berhasil diperbarui', 'success');
  } else {
    DB.addSoal(soalData);
    Utils.toast('Soal berhasil ditambahkan', 'success');
  }
  
  closeSoalModal();
  renderSoalList();
}

function hapusSoal(id) {
  Utils.confirm('Hapus Soal', 'Yakin ingin menghapus soal ini? Tindakan ini tidak dapat dibatalkan.', () => {
    DB.deleteSoal(id);
    Utils.toast('Soal berhasil dihapus', 'success');
    renderSoalList();
  });
}

function handleSoalFile(file) {
  if (!file) return;

  const allowed = ['.xlsx', '.xls', '.csv'];
  const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
  if (!allowed.includes(ext)) {
    Utils.toast('Format file tidak didukung! Gunakan file Excel (.xlsx, .xls) atau CSV (.csv)', 'error');
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    Utils.toast('Ukuran file maksimal 10 MB!', 'error');
    return;
  }

  const badge = document.getElementById('import-soal-file-badge');
  if (badge) badge.textContent = file.name;

  const reader = new FileReader();
  const isExcel = ext === '.xlsx' || ext === '.xls';

  if (isExcel && typeof XLSX !== 'undefined') {
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
        processImportedSoalRows(rawJson);
      } catch (err) {
        console.error('Error parsing Excel:', err);
        Utils.toast('Gagal membaca file Excel: ' + (err.message || err), 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        const rows = parseCSVTextSoal(text);
        processImportedSoalRows(rows);
      } catch (err) {
        console.error('Error parsing CSV:', err);
        Utils.toast('Gagal membaca file CSV: ' + (err.message || err), 'error');
      }
    };
    reader.readAsText(file);
  }
}

function parseCSVTextSoal(csvText) {
  const lines = csvText.split(/\r\n|\n/).filter(line => line.trim());
  if (lines.length < 2) return [];

  const parseLine = (text) => {
    const result = [];
    let insideQuote = false;
    let entry = '';
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (char === '"' || char === "'") {
        insideQuote = !insideQuote;
      } else if (char === ',' && !insideQuote) {
        result.push(entry.trim());
        entry = '';
      } else {
        entry += char;
      }
    }
    result.push(entry.trim());
    return result;
  };

  const headers = parseLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const values = parseLine(lines[i]);
    const row = {};
    headers.forEach((h, idx) => {
      row[h] = values[idx] || '';
    });
    rows.push(row);
  }
  return rows;
}

function processImportedSoalRows(rawRows) {
  if (!Array.isArray(rawRows) || rawRows.length === 0) {
    Utils.toast('File tidak memiliki baris data soal yang dapat dibaca', 'warning');
    return;
  }

  const defaultMapel = (document.getElementById('import-default-mapel')?.value || myMapels[0] || 'Umum').trim();
  const defaultKelas = (document.getElementById('import-default-kelas')?.value || myKelas[0] || 'Semua').trim();

  const parsedList = rawRows.map((row, idx) => {
    const getVal = (regex) => {
      for (const k of Object.keys(row)) {
        if (regex.test(k.trim())) return String(row[k]).trim();
      }
      return '';
    };

    let rawTipe = getVal(/(tipe|jenis|type)/i).toLowerCase();
    let tipe = 'pg';
    if (rawTipe.includes('b/s') || rawTipe.includes('bs') || rawTipe.includes('benar') || rawTipe.includes('salah')) {
      tipe = 'bs';
    } else if (rawTipe.includes('isian') || rawTipe.includes('singkat') || rawTipe.includes('essay')) {
      tipe = 'isian';
    } else if (rawTipe.includes('uraian') || rawTipe.includes('panjang') || rawTipe.includes('manual')) {
      tipe = 'uraian';
    } else {
      tipe = 'pg';
    }

    const pertanyaan = getVal(/(pertanyaan|soal|soal\s*ujian|text|question)/i);
    const optA = getVal(/(pilihan\s*a|opsi\s*a|^a$)/i);
    const optB = getVal(/(pilihan\s*b|opsi\s*b|^b$)/i);
    const optC = getVal(/(pilihan\s*c|opsi\s*c|^c$)/i);
    const optD = getVal(/(pilihan\s*d|opsi\s*d|^d$)/i);
    const optE = getVal(/(pilihan\s*e|opsi\s*e|^e$)/i);

    let rawKunci = getVal(/(kunci\s*jawaban|kunci|jawaban|answer|key)/i);
    let jawaban = rawKunci;
    if (tipe === 'pg') {
      jawaban = rawKunci.toUpperCase().trim();
      if (!['A', 'B', 'C', 'D', 'E'].includes(jawaban)) {
        // Coba cocokan jika isi kunci adalah teks salah satu pilihan
        if (optA && rawKunci.toLowerCase() === optA.toLowerCase()) jawaban = 'A';
        else if (optB && rawKunci.toLowerCase() === optB.toLowerCase()) jawaban = 'B';
        else if (optC && rawKunci.toLowerCase() === optC.toLowerCase()) jawaban = 'C';
        else if (optD && rawKunci.toLowerCase() === optD.toLowerCase()) jawaban = 'D';
        else if (optE && rawKunci.toLowerCase() === optE.toLowerCase()) jawaban = 'E';
        else jawaban = 'A'; // default fallback
      }
    } else if (tipe === 'bs') {
      const lower = rawKunci.toLowerCase();
      if (lower.includes('benar') || lower === 'b' || lower === 'true' || lower === '1') {
        jawaban = 'Benar';
      } else {
        jawaban = 'Salah';
      }
    }

    let bobot = parseInt(getVal(/(bobot|poin|nilai|weight|score)/i), 10);
    if (isNaN(bobot) || bobot <= 0) {
      bobot = tipe === 'uraian' ? 5 : tipe === 'isian' ? 2 : 1;
    }

    let tingkat = getVal(/(tingkat|kesulitan|level|difficulty)/i).toLowerCase();
    if (!['mudah', 'sedang', 'sulit'].includes(tingkat)) {
      tingkat = 'sedang';
    }

    const mapel = getVal(/(mapel|mata\s*pelajaran|subject)/i) || defaultMapel;
    const kelas = getVal(/(kelas|grade|class)/i) || defaultKelas;
    const bab = getVal(/(bab|materi|topik|chapter|topic)/i) || 'Umum';

    // Susun pilihan untuk PG
    let pilihan = [];
    if (tipe === 'pg') {
      pilihan = [optA, optB, optC, optD, optE].filter(Boolean);
      if (pilihan.length < 2) {
        // jika pilihan kurang dari 2, buat minimal dummy atau tandai invalid
        pilihan = [optA || 'Pilihan A', optB || 'Pilihan B', optC || 'Pilihan C', optD || 'Pilihan D'];
      }
    }

    // Validasi kelengkapan
    let isValid = true;
    let errorMsg = '';
    if (!pertanyaan) {
      isValid = false;
      errorMsg = 'Pertanyaan kosong';
    } else if (tipe === 'pg' && (!jawaban || !['A', 'B', 'C', 'D', 'E'].includes(jawaban))) {
      isValid = false;
      errorMsg = 'Kunci PG harus A/B/C/D/E';
    } else if (!mapel) {
      isValid = false;
      errorMsg = 'Mapel belum diisi';
    }

    return {
      rowNum: idx + 1,
      tipe,
      pertanyaan,
      pilihan,
      jawaban,
      bobot,
      tingkat,
      mapel,
      kelas,
      bab,
      pembuatId: session.userId,
      isValid,
      errorMsg
    };
  });

  importedSoalCache = parsedList;
  renderImportSoalPreview();
}

function renderImportSoalPreview() {
  const list = importedSoalCache;
  const dropZone = document.getElementById('drop-zone-soal');
  const preview = document.getElementById('import-soal-preview-container');
  const tbody = document.getElementById('import-soal-preview-tbody');
  const summary = document.getElementById('import-soal-summary-text');
  const breakdown = document.getElementById('import-soal-breakdown');
  const submitBtn = document.getElementById('btn-submit-import-soal');

  if (!preview || !tbody) return;

  if (dropZone) dropZone.style.display = 'none';
  preview.style.display = 'block';

  const validCount = list.filter(s => s.isValid).length;
  const invalidCount = list.length - validCount;

  if (summary) {
    summary.innerHTML = `${list.length} Soal Terdeteksi (${validCount} valid${invalidCount > 0 ? `, <span style="color:var(--danger)">${invalidCount} perlu dicek</span>` : ''})`;
  }

  // Hitung sebaran tipe
  const counts = { pg: 0, bs: 0, isian: 0, uraian: 0 };
  list.forEach(s => { if (counts[s.tipe] !== undefined) counts[s.tipe]++; });

  if (breakdown) {
    breakdown.innerHTML = `
      <span class="badge badge-primary">🔘 ${counts.pg} Pilihan Ganda</span>
      <span class="badge badge-success">✅ ${counts.bs} Benar/Salah</span>
      <span class="badge badge-warning">✏️ ${counts.isian} Isian</span>
      <span class="badge badge-info">📝 ${counts.uraian} Uraian</span>
    `;
  }

  if (submitBtn) {
    submitBtn.disabled = validCount === 0;
    submitBtn.textContent = `🚀 Impor Sekarang (${validCount} Soal Valid)`;
  }

  tbody.innerHTML = list.map(s => `
    <tr style="${s.isValid ? '' : 'background:#FEF2F2'}">
      <td style="font-weight:700;color:var(--gray-500)">#${s.rowNum}</td>
      <td>
        <span class="badge ${s.tipe === 'pg' ? 'badge-primary' : s.tipe === 'bs' ? 'badge-success' : s.tipe === 'isian' ? 'badge-warning' : 'badge-info'}" style="font-size:10px">
          ${s.tipe.toUpperCase()}
        </span>
      </td>
      <td>
        <div style="font-weight:600;color:var(--gray-800);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Utils.escapeHtml(s.pertanyaan)}</div>
        <div style="font-size:11px;color:var(--gray-500)">${Utils.escapeHtml(s.mapel)} • Kelas: ${Utils.escapeHtml(s.kelas)} • ${Utils.escapeHtml(s.bab)}</div>
      </td>
      <td>
        ${s.tipe === 'pg' ? `<span class="badge badge-primary">Kunci: ${s.jawaban}</span> (${s.pilihan.length} Opsi)` : `<span class="badge badge-gray">Kunci: ${Utils.escapeHtml(s.jawaban || '-')}</span>`}
      </td>
      <td><span class="badge badge-gray">${s.bobot}</span></td>
      <td>
        ${s.isValid 
          ? `<span class="badge badge-success">✓ Siap</span>` 
          : `<span class="badge badge-danger" title="${Utils.escapeHtml(s.errorMsg)}">✕ ${Utils.escapeHtml(s.errorMsg)}</span>`}
      </td>
    </tr>
  `).join('');
}

async function executeImportSoal() {
  const validSoal = importedSoalCache.filter(s => s.isValid).map(s => ({
    tipe: s.tipe,
    mapel: s.mapel,
    kelas: s.kelas,
    bab: s.bab,
    pertanyaan: s.pertanyaan,
    pilihan: s.pilihan,
    jawaban: s.jawaban,
    bobot: s.bobot,
    tingkat: s.tingkat,
    pembuatId: session.userId,
  }));

  if (validSoal.length === 0) {
    Utils.toast('Tidak ada soal valid yang dapat diimpor!', 'warning');
    return;
  }

  const submitBtn = document.getElementById('btn-submit-import-soal');
  const progressContainer = document.getElementById('import-soal-progress-container');
  const progressBar = document.getElementById('import-soal-progress-bar');
  const progressText = document.getElementById('import-soal-progress-text');
  const progressPercent = document.getElementById('import-soal-progress-percent');

  if (submitBtn) submitBtn.disabled = true;
  if (progressContainer) progressContainer.style.display = 'block';

  try {
    const res = await DB.addSoalBatch(validSoal, (current, total) => {
      const pct = Math.round((current / total) * 100);
      if (progressBar) progressBar.style.width = pct + '%';
      if (progressPercent) progressPercent.textContent = pct + '%';
      if (progressText) progressText.textContent = `Menyimpan ${current} dari ${total} soal...`;
    });

    Utils.toast(`🎉 Berhasil mengimpor ${res.inserted || validSoal.length} soal ke Bank Soal!`, 'success');
    closeImportSoalModal();
    renderSoalList();
  } catch (err) {
    console.error('Error batch importing soal:', err);
    Utils.toast('Gagal mengimpor soal: ' + (err.message || err), 'error');
  } finally {
    if (submitBtn) submitBtn.disabled = false;
  }
}

function downloadTemplateCSVSoal() {
  const headers = ["No","Tipe","Pertanyaan","Pilihan A","Pilihan B","Pilihan C","Pilihan D","Pilihan E","Kunci Jawaban","Bobot","Tingkat","Mapel","Kelas","Bab"];
  const rows = [
    [1, "pg", "Jika f(x) = 2x + 5, maka nilai f(4) adalah...", "11", "13", "15", "17", "19", "B", 1, "mudah", "Matematika", "XI", "Fungsi Aljabar"],
    [2, "bs", "Bilangan prima terkecil adalah angka 2.", "", "", "", "", "", "Benar", 1, "mudah", "Matematika", "XI", "Teori Bilangan"],
    [3, "isian", "Jika 4x - 8 = 16, maka nilai x adalah...", "", "", "", "", "", "6", 2, "sedang", "Matematika", "XI", "Persamaan Linear"],
    [4, "uraian", "Jelaskan rumus keliling dan luas lingkaran!", "", "", "", "", "", "Keliling = 2*pi*r, Luas = pi*r^2", 5, "sedang", "Matematika", "XI", "Geometri"]
  ];

  const escapeCSV = val => {
    const s = String(val === null || val === undefined ? '' : val);
    if (s.includes(',') || s.includes('"') || s.includes('\n')) {
      return `"${s.replace(/"/g, '""')}"`;
    }
    return s;
  };

  const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + 
    [headers.map(escapeCSV).join(','), ...rows.map(r => r.map(escapeCSV).join(','))].join('\r\n');

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "template_bank_soal.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  Utils.toast('Template CSV berhasil diunduh', 'success');
}
