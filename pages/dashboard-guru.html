<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Dashboard Guru - Aplikasi Ulangan Digital"/>
  <title>Dashboard Guru - Ulangan Digital</title>
  <link rel="stylesheet" href="../css/style.css?v=2.2"/>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/storage.js?v=2.2"></script>
<script src="../js/utils.js?v=2.2"></script>
<script src="../js/auth.js?v=2.2"></script>
<script src="../js/layout.js?v=2.2"></script>
<script>
DB.init();
Auth.init();
const session = Layout.initStaff('dashboard', ['guru', 'admin']);
try {
  if (session) renderDashboard();
} catch (err) {
  console.error('Error rendering Dashboard:', err);
  Layout.setContent(`
    <div class="alert alert-danger" style="margin:24px">
      <span class="alert-icon">❌</span>
      <div><strong>Gagal memuat Dashboard:</strong> ${Utils.escapeHtml(err.message)}</div>
    </div>
  `);
}

// Sinkronkan data hasil ujian terbaru dari Supabase Cloud
window.addEventListener('supabase-synced', () => {
  if (session) renderDashboard();
});

function renderDashboard() {
  Layout.setPageTitle('Dashboard');
  
  const myMapels = DB.getGuruMapels(session);
  const myKelas = DB.getGuruKelas(session);
  const isAdmin = session.role === 'admin';

  const ujianList = DB.getUjian().filter(u => Boolean(u) && (isAdmin || DB.isGuruMatch(session, u.mapel, u.kelas) || u.guruId === session.userId));
  const teacherUjianIds = new Set(ujianList.map(u => u.id));
  const hasilList = DB.getHasil().filter(h => isAdmin || teacherUjianIds.has(h.ujianId) || (h.guruId && h.guruId === session.userId));
  const soalList = DB.getSoal().filter(s => Boolean(s) && (isAdmin || DB.isGuruMatch(session, s.mapel, s.kelas) || s.pembuatId === session.userId));
  const logs = DB.getLogs().filter(l => isAdmin || (l.ujianId && teacherUjianIds.has(l.ujianId)));

  const allSiswa = DB.getUsers().filter(u => u.role === 'siswa');
  const siswaCount = (!isAdmin && myKelas.length > 0)
    ? allSiswa.filter(s => myKelas.some(k => (s.kelas||'').toLowerCase().includes(k.toLowerCase()))).length
    : allSiswa.length;
  
  const aktifCount = ujianList.filter(u => Utils.isUjianAktif(u)).length;
  const selesaiHasil = hasilList.filter(h => h.status === 'selesai');
  const avgNilai = selesaiHasil.length ? (selesaiHasil.reduce((a,b) => a + (b.nilai||0), 0) / selesaiHasil.length).toFixed(1) : '-';
  const lulusCount = selesaiHasil.filter(h => h.lulus).length;
  const violationLogs = logs.filter(l => l.category === 'violation');

  const recentLogs = logs.filter(l => l.category === 'exam' || l.category === 'violation').slice(0, 8);
  const recentHasil = hasilList.filter(h => h.status === 'selesai').sort((a,b) => b.submittedAt - a.submittedAt).slice(0, 5);

  const content = `
  <div class="animate-fade-in">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Selamat datang kembali, ${Utils.escapeHtml(session.name)}! 👋</p>
        ${!isAdmin ? `
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap">
          <span class="badge badge-primary">📚 Mapel: ${myMapels.length ? myMapels.join(', ') : 'Semua Mapel'}</span>
          <span class="badge badge-success">👥 Kelas: ${myKelas.length ? myKelas.join(', ') : 'Semua Kelas'}</span>
          <a href="pengaturan.html" style="font-size:12px;color:var(--primary);margin-left:4px;text-decoration:underline">⚙️ Ubah Mapel & Kelas</a>
        </div>` : ''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="bank-soal.html" class="btn btn-outline">
          📚 Bank Soal
        </a>
        <a href="manajemen-ujian.html" class="btn btn-outline">
          📋 Manajemen Ujian
        </a>
        <a href="hasil.html" class="btn btn-outline">
          📊 Hasil & Nilai
        </a>
        <a href="manajemen-ujian.html" class="btn btn-primary">
          ➕ Buat Ujian Baru
        </a>
      </div>
    </div>

    <!-- Quick Access Cards -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px">
      <div class="card" style="cursor:pointer;border-left:4px solid var(--primary);transition:all 0.2s" onclick="window.location.href='manajemen-ujian.html'">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-weight:700;font-size:15px;color:var(--gray-900);display:flex;align-items:center;gap:8px">
            <span style="font-size:20px">📋</span> Manajemen Ujian
          </div>
          <span class="badge badge-primary">${ujianList.length} Ujian</span>
        </div>
        <p style="font-size:13px;color:var(--gray-600);margin-bottom:12px">Buat ujian baru, atur durasi, jadwal, kelas, dan aktifkan ujian untuk siswa.</p>
        <a href="manajemen-ujian.html" class="btn btn-sm btn-primary" style="width:100%;text-align:center">Kelola Ujian →</a>
      </div>

      <div class="card" style="cursor:pointer;border-left:4px solid var(--success);transition:all 0.2s" onclick="window.location.href='bank-soal.html'">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-weight:700;font-size:15px;color:var(--gray-900);display:flex;align-items:center;gap:8px">
            <span style="font-size:20px">📚</span> Bank Soal
          </div>
          <span class="badge badge-success">${soalList.length} Soal</span>
        </div>
        <p style="font-size:13px;color:var(--gray-600);margin-bottom:12px">Kelola kumpulan soal (PG, Isian, Uraian, dsb.) per mata pelajaran.</p>
        <a href="bank-soal.html" class="btn btn-sm btn-outline" style="width:100%;text-align:center">Kelola Soal →</a>
      </div>

      <div class="card" style="cursor:pointer;border-left:4px solid #8b5cf6;transition:all 0.2s" onclick="window.location.href='hasil.html'">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-weight:700;font-size:15px;color:var(--gray-900);display:flex;align-items:center;gap:8px">
            <span style="font-size:20px">📊</span> Hasil & Nilai
          </div>
          <span class="badge" style="background:#ede9fe;color:#6d28d9">${selesaiHasil.length} Selesai</span>
        </div>
        <p style="font-size:13px;color:var(--gray-600);margin-bottom:12px">Rekap nilai siswa, pantau status pengerjaan, dan ekspor data ke file CSV.</p>
        <a href="hasil.html" class="btn btn-sm btn-outline" style="width:100%;text-align:center">Buka Hasil & Nilai →</a>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue">📋</div>
        <div>
          <div class="stat-value">${ujianList.length}</div>
          <div class="stat-label">Total Ujian</div>
          <div class="stat-trend up">✅ ${aktifCount} aktif sekarang</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">📚</div>
        <div>
          <div class="stat-value">${soalList.length}</div>
          <div class="stat-label">Bank Soal</div>
          <div class="stat-trend up">📝 Soal tersedia</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">🎓</div>
        <div>
          <div class="stat-value">${siswaCount}</div>
          <div class="stat-label">Siswa Terdaftar</div>
          <div class="stat-trend up">👤 Pengguna aktif</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">📊</div>
        <div>
          <div class="stat-value">${avgNilai}</div>
          <div class="stat-label">Rata-rata Nilai</div>
          <div class="stat-trend ${parseFloat(avgNilai) >= 75 ? 'up' : 'down'}">${lulusCount} siswa lulus</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">⚠️</div>
        <div>
          <div class="stat-value">${violationLogs.length}</div>
          <div class="stat-label">Total Pelanggaran</div>
          <div class="stat-trend down">🔍 Perlu diperhatikan</div>
        </div>
      </div>
    </div>

    <div class="grid-2 gap-6" style="margin-top:24px">
      <!-- Ujian Aktif -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">📋 Ujian Aktif</h3>
          <a href="manajemen-ujian.html" class="btn btn-sm btn-outline">Lihat Semua</a>
        </div>
        ${ujianList.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <div class="empty-state-title">Belum ada ujian</div>
            <div class="empty-state-text">Buat ujian pertama Anda</div>
          </div>
        ` : ujianList.slice(0,4).map(u => {
          const hasil = DB.getHasilByUjian(u.id);
          const statusBadge = Utils.isUjianAktif(u) ? '<span class="badge badge-success">🟢 Aktif</span>' : 
            u.status === 'draft' ? '<span class="badge badge-gray">📝 Draft</span>' :
            '<span class="badge badge-warning">⏸️ Tidak Aktif</span>';
          return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gray-100)">
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:14px;color:var(--gray-800);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Utils.escapeHtml(u.judul)}</div>
              <div style="font-size:12px;color:var(--gray-500)">${Utils.escapeHtml(u.mapel)} • ${Utils.escapeHtml(u.kelas)} • Kode: <strong>${u.kode}</strong></div>
              <div style="font-size:12px;color:var(--gray-500);margin-top:2px">👥 ${hasil.length} peserta • ⏱️ ${u.durasi} menit</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:12px">
              ${statusBadge}
              <a href="hasil.html?ujianId=${u.id}" class="btn btn-sm btn-outline">Hasil</a>
            </div>
          </div>`;
        }).join('')}
      </div>

      <!-- Aktivitas Terbaru -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">🔔 Aktivitas Terbaru</h3>
          <a href="audit-log.html" class="btn btn-sm btn-outline">Lihat Semua</a>
        </div>
        ${recentLogs.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <div class="empty-state-title">Belum ada aktivitas</div>
          </div>
        ` : `
        <div class="audit-timeline" style="padding-left:8px">
          ${recentLogs.map(log => `
          <div class="audit-item">
            <div class="audit-dot ${log.severity === 'warning' ? 'warning' : log.severity === 'danger' ? 'danger' : log.severity === 'success' ? 'success' : 'info'}">
              ${log.icon || '📌'}
            </div>
            <div class="audit-content">
              <div class="audit-action">${Utils.escapeHtml(log.type?.replace(/_/g,' '))}</div>
              <div class="audit-detail">${Utils.escapeHtml(log.actor || '-')} • ${Utils.escapeHtml(log.detail || '')}</div>
              <div class="audit-time">${Utils.timeAgo(log.timestamp)}</div>
            </div>
          </div>`).join('')}
        </div>`}
      </div>
    </div>

    <!-- Hasil Terbaru -->
    <div class="card mt-6">
      <div class="card-header">
        <h3 class="card-title">📊 Hasil Ujian Terbaru</h3>
        <a href="hasil.html" class="btn btn-sm btn-outline">Lihat Semua</a>
      </div>
      ${recentHasil.length === 0 ? `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-title">Belum ada hasil ujian</div>
        </div>
      ` : `
      <div class="table-wrapper">
        <table>
          <thead><tr>
            <th>Siswa</th><th>Ujian</th><th>Nilai</th><th>Status</th><th>Pelanggaran</th><th>Waktu</th>
          </tr></thead>
          <tbody>
            ${recentHasil.map(h => `
            <tr>
              <td><div style="font-weight:600">${Utils.escapeHtml(h.siswaName)}</div></td>
              <td><div style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Utils.escapeHtml(h.ujianJudul)}</div></td>
              <td>
                <span style="font-weight:700;font-size:16px;color:${h.lulus ? 'var(--success)' : 'var(--danger)'}">${Utils.formatScore(h.nilai)}</span>
              </td>
              <td>${h.lulus ? '<span class="badge badge-success">✅ Lulus</span>' : '<span class="badge badge-danger">❌ Tidak Lulus</span>'}</td>
              <td>
                ${h.violationCount > 0 ? `<span class="badge badge-warning">⚠️ ${h.violationCount}x</span>` : '<span class="badge badge-gray">—</span>'}
              </td>
              <td class="text-sm text-muted">${Utils.formatDuration(h.waktuPengerjaan)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>

    <!-- Statistik Distribusi Nilai -->
    ${selesaiHasil.length > 0 ? `
    <div class="card mt-6">
      <div class="card-header">
        <h3 class="card-title">📈 Distribusi Nilai</h3>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px">
        ${buildDistribusiChart(selesaiHasil)}
      </div>
    </div>` : ''}
  </div>`;

  Layout.setContent(content);
}

function buildDistribusiChart(hasilList) {
  const ranges = [
    { label: '90-100 (Sangat Baik)', min: 90, max: 100, color: 'var(--success)' },
    { label: '75-89 (Baik)', min: 75, max: 89, color: 'var(--primary)' },
    { label: '60-74 (Cukup)', min: 60, max: 74, color: 'var(--warning)' },
    { label: '0-59 (Kurang)', min: 0, max: 59, color: 'var(--danger)' },
  ];
  const total = hasilList.length;
  return ranges.map(r => {
    const count = hasilList.filter(h => h.nilai >= r.min && h.nilai <= r.max).length;
    const pct = total > 0 ? Math.round((count/total)*100) : 0;
    return `
    <div class="progress-bar-container">
      <div class="progress-label">
        <span style="font-size:13px;color:var(--gray-700)">${r.label}</span>
        <span style="font-weight:700;color:${r.color}">${count} siswa (${pct}%)</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${pct}%;background:${r.color}"></div>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
