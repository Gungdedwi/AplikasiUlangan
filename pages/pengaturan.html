<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengaturan - Ulangan Digital</title>
  <link rel="stylesheet" href="../css/style.css?v=2.2"/>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/storage.js?v=2.2"></script>
<script src="../js/utils.js?v=2.2"></script>
<script src="../js/auth.js?v=2.2"></script>
<script src="../js/layout.js?v=2.2"></script>
<script>
DB.init();
Auth.init();
const session = Layout.initStaff('pengaturan', ['admin', 'guru']);

const COMMON_MAPEL = ['Informatika', 'Matematika', 'Bahasa Indonesia', 'Bahasa Inggris', 'IPA', 'IPS', 'Fisika', 'Kimia', 'Biologi', 'PJOK', 'PKN', 'Seni Budaya', 'PAI / Agama'];
const COMMON_KELAS = ['7A', '7B', '7C', '8A', '8B', '8C', '9A', '9B', '9C', 'X IPA 1', 'XI IPA 1', 'XII IPA 1'];

function toggleTagInInput(inputId, tag) {
  const input = document.getElementById(inputId);
  if (!input) return;
  let items = input.value.split(',').map(s => s.trim()).filter(Boolean);
  const idx = items.findIndex(item => item.toLowerCase() === tag.toLowerCase());
  if (idx >= 0) {
    items.splice(idx, 1);
  } else {
    items.push(tag);
  }
  input.value = items.join(', ');
}

try {
  if (session) renderPengaturan();
} catch (err) {
  console.error('Error rendering Pengaturan:', err);
  Layout.setContent(`
    <div class="alert alert-danger" style="margin:24px">
      <span class="alert-icon">❌</span>
      <div><strong>Gagal memuat Pengaturan:</strong> ${Utils.escapeHtml(err.message)}</div>
    </div>
  `);
}

function renderPengaturan() {
  Layout.setPageTitle('Pengaturan');
  const settings = DB.getSettings();
  const isAdmin = session.role === 'admin';
  const isGuru = session.role === 'guru';

  const teacherMapel = session.mapel || '';
  const teacherKelas = session.kelasAmpu || '';

  // Hitung cakupan untuk guru
  const myMapels = DB.getGuruMapels(session);
  const myKelas = DB.getGuruKelas(session);
  const mySoalCount = DB.getSoal().filter(s => DB.isGuruMatch(session, s.mapel, s.kelas) || s.pembuatId === session.userId).length;
  const myUjianCount = DB.getUjian().filter(u => DB.isGuruMatch(session, u.mapel, u.kelas) || u.guruId === session.userId).length;

  const content = `
  <div class="animate-fade-in">
    <div class="mb-6">
      <h1 class="page-title">${isAdmin ? 'Pengaturan Sistem & Pengguna' : 'Profil Pengajar & Pengaturan'}</h1>
      <p class="page-subtitle">${isAdmin ? 'Konfigurasi sistem, database cloud, Exam Mode, dan manajemen akun guru & siswa' : 'Kelola identitas, mata pelajaran, dan kelas yang Anda ampu'}</p>
    </div>

    <!-- Profil Pengajar & Bidang Ampuan (Khusus Guru / Admin) -->
    <div class="card mb-6" style="border: 1.5px solid var(--primary-light); background: linear-gradient(to right, #FFFFFF, #F8FAFC)">
      <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:28px">👨‍🏫</span>
          <div>
            <h3 class="card-title" style="margin:0">Profil Pengajar & Bidang Ampuan</h3>
            <div style="font-size:12px;color:var(--gray-500)">Atur Mata Pelajaran dan Kelas yang Anda ampu agar bank soal dan ujian otomatis terfilter</div>
          </div>
        </div>
        <span class="badge ${isAdmin ? 'badge-primary' : 'badge-success'}" style="font-size:12px;padding:6px 12px">
          ${isAdmin ? '🛡️ Administrator' : '👨‍🏫 Guru / Pendidik'}
        </span>
      </div>
      <div style="padding:16px 0 0 0">
        <form onsubmit="saveGuruProfile(event)" novalidate>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="mb-4">
            <div>
              <label class="form-label" style="font-weight:600">Nama Lengkap <span class="required">*</span></label>
              <input type="text" id="gp-name" class="form-control" value="${Utils.escapeHtml(session.name)}" placeholder="Nama Lengkap dengan Gelar" maxlength="100" />
            </div>
            <div>
              <label class="form-label" style="font-weight:600">Username Login</label>
              <input type="text" class="form-control" value="${Utils.escapeHtml(session.username)}" readonly disabled style="background:var(--gray-100);cursor:not-allowed" />
            </div>
          </div>

          <div class="form-group mb-4">
            <label class="form-label" style="font-weight:600">Mata Pelajaran yang Diampu</label>
            <div style="font-size:11px;color:var(--gray-500);margin-bottom:6px">Klik tag di bawah untuk menambah/menghapus secara cepat, atau ketik langsung (pisahkan dengan koma):</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
              ${COMMON_MAPEL.map(m => {
                const isActive = myMapels.some(item => item.toLowerCase() === m.toLowerCase());
                return `<button type="button" class="btn ${isActive ? 'btn-primary' : 'btn-outline'} btn-xs" style="padding:4px 10px;font-size:11px;border-radius:20px" onclick="toggleTagInInput('gp-mapel', '${m}')">${isActive ? '✓ ' : '+ '}${m}</button>`;
              }).join('')}
            </div>
            <input type="text" id="gp-mapel" class="form-control" value="${Utils.escapeHtml(teacherMapel)}" placeholder="Contoh: Informatika, Matematika" maxlength="200" />
          </div>

          <div class="form-group mb-4">
            <label class="form-label" style="font-weight:600">Kelas yang Diampu</label>
            <div style="font-size:11px;color:var(--gray-500);margin-bottom:6px">Pilih kelas yang Anda ajar (pisahkan dengan koma):</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
              ${COMMON_KELAS.map(k => {
                const isActive = myKelas.some(item => item.toLowerCase() === k.toLowerCase());
                return `<button type="button" class="btn ${isActive ? 'btn-primary' : 'btn-outline'} btn-xs" style="padding:4px 10px;font-size:11px;border-radius:20px" onclick="toggleTagInInput('gp-kelas', '${k}')">${isActive ? '✓ ' : '+ '}${k}</button>`;
              }).join('')}
            </div>
            <input type="text" id="gp-kelas" class="form-control" value="${Utils.escapeHtml(teacherKelas)}" placeholder="Contoh: 8A, 8B, 91, XI IPA 1" maxlength="200" />
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--gray-200);padding-top:16px">
            <div style="font-size:12px;color:var(--gray-500)">
              Data mapel & kelas akan otomatis tersinkron ke cloud Supabase dan menjadi filter utama Anda.
            </div>
            <button type="submit" class="btn btn-primary">💾 Simpan Profil & Bidang Ampuan</button>
          </div>
        </form>
      </div>
    </div>

    ${isGuru ? `
    <!-- Ringkasan Ruang Lingkup Guru -->
    <div class="card mb-6">
      <div class="card-header"><h3 class="card-title">📊 Ruang Lingkup & Statistik Anda</h3></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
        <div style="background:var(--primary-pale);border-radius:var(--radius);padding:14px;text-align:center">
          <div style="font-size:24px;margin-bottom:4px">📚</div>
          <div style="font-size:20px;font-weight:700;color:var(--primary)">${myMapels.length ? myMapels.join(', ') : '-'}</div>
          <div style="font-size:11px;color:var(--gray-500)">Mata Pelajaran Aktif</div>
        </div>
        <div style="background:var(--success-light);border-radius:var(--radius);padding:14px;text-align:center">
          <div style="font-size:24px;margin-bottom:4px">👥</div>
          <div style="font-size:20px;font-weight:700;color:var(--success)">${myKelas.length ? myKelas.join(', ') : 'Semua'}</div>
          <div style="font-size:11px;color:var(--gray-500)">Kelas Ampuan</div>
        </div>
        <div style="background:var(--gray-50);border-radius:var(--radius);padding:14px;text-align:center">
          <div style="font-size:24px;margin-bottom:4px">📝</div>
          <div style="font-size:20px;font-weight:700;color:var(--primary-dark)">${mySoalCount} Soal</div>
          <div style="font-size:11px;color:var(--gray-500)">Soal Relevan di Bank Soal</div>
        </div>
        <div style="background:var(--gray-50);border-radius:var(--radius);padding:14px;text-align:center">
          <div style="font-size:24px;margin-bottom:4px">📋</div>
          <div style="font-size:20px;font-weight:700;color:var(--primary-dark)">${myUjianCount} Ujian</div>
          <div style="font-size:11px;color:var(--gray-500)">Ujian Terjadwal Anda</div>
        </div>
      </div>
    </div>
    ` : ''}

    ${isAdmin ? `
    <!-- Integrasi Supabase Cloud -->
    <div class="card mb-6" style="border: 1.5px solid var(--primary-light); background: linear-gradient(to right, #F8FAFC, #EFF6FF)">
      <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:24px">☁️</span>
          <div>
            <h3 class="card-title" style="margin:0">Integrasi Database Cloud (Supabase)</h3>
            <div style="font-size:12px;color:var(--gray-500)">Sinkronisasi Bank Soal, Autosave Jawaban, Auth Guru & Siswa, serta Audit Log di Cloud</div>
          </div>
        </div>
        <div id="supabase-status-badge">
          ${DB.isConnected
            ? '<span class="badge badge-success" style="font-size:12px;padding:6px 12px">🟢 Terhubung ke Cloud</span>'
            : '<span class="badge badge-warning" style="font-size:12px;padding:6px 12px">🟡 Mode Lokal / Belum Diatur</span>'}
        </div>
      </div>
      <div style="padding:16px 0 0 0">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="mb-4">
          <div>
            <label class="form-label" style="font-weight:600">Supabase Project URL <span class="required">*</span></label>
            <input type="text" id="sb-url" class="form-control" placeholder="https://xyzcompany.supabase.co" value="${Utils.escapeHtml(DB.getSupabaseConfig().url || '')}" />
            <div style="font-size:11px;color:var(--gray-400);margin-top:4px">Didapatkan dari Supabase Dashboard ➔ Project Settings ➔ API</div>
          </div>
          <div>
            <label class="form-label" style="font-weight:600">Supabase Anon Public Key <span class="required">*</span></label>
            <input type="password" id="sb-key" class="form-control" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." value="${Utils.escapeHtml(DB.getSupabaseConfig().anonKey || '')}" />
            <div style="font-size:11px;color:var(--gray-400);margin-top:4px">Kunci anon / public client (Aman digunakan di browser)</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button onclick="saveSupabaseConfig()" class="btn btn-primary btn-sm">💾 Simpan & Hubungkan</button>
          <button onclick="testSupabaseConn()" class="btn btn-outline btn-sm">🔄 Uji Koneksi</button>
          <button onclick="syncSupabaseData()" class="btn btn-secondary btn-sm">☁️ Tarik Data Terbaru</button>
          <button onclick="showSqlModal()" class="btn btn-ghost btn-sm" style="color:var(--primary)">📋 Lihat Skrip SQL DDL</button>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
      <!-- Exam Mode Settings -->
      <div class="card">
        <div class="card-header"><h3 class="card-title">🛡️ Pengaturan Exam Mode</h3></div>
        <div class="settings-section">
          <div class="settings-section-title">Keamanan Ujian</div>
          
          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Wajib Fullscreen</div>
              <div class="hint">Siswa harus dalam mode fullscreen saat ujian</div>
            </div>
            <div class="settings-item-control">
              <div class="toggle-track ${settings.requireFullscreen?'on':''}" id="t-fullscreen" onclick="toggleSetting(this,'requireFullscreen')"><div class="toggle-thumb" style="left:${settings.requireFullscreen?'22':'2'}px"></div></div>
            </div>
          </div>

          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Maks. Pelanggaran (Default)</div>
              <div class="hint">Jumlah pelanggaran sebelum ujian ditangguhkan</div>
            </div>
            <div class="settings-item-control">
              <input type="number" id="s-max-violations" class="form-control" value="${settings.maxViolations||3}" min="1" max="20" style="width:70px;text-align:center" onchange="saveSetting('maxViolations',parseInt(this.value))"/>
            </div>
          </div>

          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Interval Autosave (detik)</div>
              <div class="hint">Seberapa sering jawaban disimpan otomatis</div>
            </div>
            <div class="settings-item-control">
              <input type="number" id="s-autosave" class="form-control" value="${settings.autosaveInterval||30}" min="10" max="300" style="width:80px;text-align:center" onchange="saveSetting('autosaveInterval',parseInt(this.value))"/>
            </div>
          </div>

          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Izinkan Tandai Soal</div>
              <div class="hint">Siswa dapat menandai soal untuk ditinjau ulang</div>
            </div>
            <div class="settings-item-control">
              <div class="toggle-track ${settings.allowFlagQuestion?'on':''}" id="t-flag" onclick="toggleSetting(this,'allowFlagQuestion')"><div class="toggle-thumb" style="left:${settings.allowFlagQuestion?'22':'2'}px"></div></div>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">Hasil Ujian</div>
          
          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Izinkan Review Soal</div>
              <div class="hint">Siswa bisa kembali ke soal sebelumnya</div>
            </div>
            <div class="settings-item-control">
              <div class="toggle-track ${settings.allowReview?'on':''}" id="t-review" onclick="toggleSetting(this,'allowReview')"><div class="toggle-thumb" style="left:${settings.allowReview?'22':'2'}px"></div></div>
            </div>
          </div>

          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Tampilkan Nilai Langsung</div>
              <div class="hint">Siswa dapat melihat nilai setelah submit (default global)</div>
            </div>
            <div class="settings-item-control">
              <div class="toggle-track ${settings.showScoreImmediately?'on':''}" id="t-score" onclick="toggleSetting(this,'showScoreImmediately')"><div class="toggle-thumb" style="left:${settings.showScoreImmediately?'22':'2'}px"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Manajemen Pengguna -->
      <div class="card">
        <div class="card-header">
          <div>
            <h3 class="card-title">👥 Manajemen Pengguna</h3>
            <div style="font-size:12px;color:var(--gray-500)">Kelola akun Administrator, Guru (beserta mapel/kelas), dan Siswa</div>
          </div>
          <button onclick="openAddUserModal()" class="btn btn-sm btn-primary">➕ Tambah Pengguna</button>
        </div>
        <div id="user-list-container"></div>
      </div>
    </div>

    <!-- Informasi Sistem -->
    <div class="card mt-6">
      <div class="card-header"><h3 class="card-title">ℹ️ Informasi Sistem</h3></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
        ${buildSysInfo()}
      </div>
      <div class="divider"></div>
      <div class="alert alert-warning">
        <span class="alert-icon">⚠️</span>
        <div><strong>Catatan Keamanan Exam Mode:</strong> Web browser biasa tidak dapat menjamin penguncian perangkat 100%. Untuk keamanan tingkat perangkat, gunakan kiosk browser atau managed-device mode (misalnya: Chrome Kiosk Mode, Safe Exam Browser).</div>
      </div>
      <div class="alert alert-info mt-4">
        <span class="alert-icon">🔒</span>
        <div><strong>Proteksi yang Diimplementasikan:</strong> Page Visibility API, Fullscreen Detection, Window Blur/Focus, Keyboard Shortcut Blocking (F12, DevTools, Print), Context Menu Disabled, Copy/Paste Disabled, Browser Back Button Detection, Autosave setiap ${settings.autosaveInterval||30} detik.</div>
      </div>
      <div class="mt-4" style="display:flex;gap:10px;flex-wrap:wrap">
        <button onclick="resetData()" class="btn btn-danger btn-sm">⚠️ Reset Semua Data</button>
        <button onclick="exportAllData()" class="btn btn-outline btn-sm">📦 Backup Data</button>
        <button onclick="seedDemoData()" class="btn btn-secondary btn-sm">🌱 Isi Data Contoh (Demo)</button>
      </div>
    </div>
    ` : `
    <!-- Keamanan Ujian Info untuk Guru -->
    <div class="card mt-6">
      <div class="card-header"><h3 class="card-title">🛡️ Informasi Proteksi & Keamanan Exam Mode</h3></div>
      <div class="alert alert-info">
        <span class="alert-icon">🔒</span>
        <div><strong>Proteksi Ujian Aktif:</strong> Siswa diwajibkan masuk Fullscreen, keluar fullscreen atau membuka tab lain dicatat sebagai pelanggaran pada Audit Log, dan jawaban siswa otomatis tersimpan (autosave) secara berkala ke cloud.</div>
      </div>
    </div>
    `}

    <!-- Modal Tambah / Edit User -->
    <div id="modal-add-user" class="modal-backdrop" style="display:none">
      <div class="modal modal-lg">
        <div class="modal-header">
          <h3 class="modal-title" id="modal-user-title">Tambah Pengguna</h3>
          <button class="modal-close" onclick="closeUserModal()">✕</button>
        </div>
        <div class="modal-body" id="add-user-body"></div>
      </div>
    </div>

    <!-- Modal SQL DDL -->
    <div id="modal-sql" class="modal-backdrop" style="display:none">
      <div class="modal modal-lg">
        <div class="modal-header">
          <h3 class="modal-title">📋 Skrip SQL DDL Supabase</h3>
          <button class="modal-close" onclick="closeSqlModal()">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size:13px;color:var(--gray-600);margin-bottom:12px">
            Salin skrip SQL ini lalu jalankan di: <strong>Supabase Dashboard ➔ SQL Editor ➔ New Query ➔ Run</strong>.
          </p>
          <textarea id="sql-ddl-text" class="form-control" style="height:280px;font-family:monospace;font-size:12px;background:#0F172A;color:#E2E8F0;padding:12px" readonly></textarea>
          <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px">
            <button type="button" onclick="copySqlDDL()" class="btn btn-primary btn-sm">📋 Salin Skrip SQL</button>
            <button type="button" onclick="closeSqlModal()" class="btn btn-secondary btn-sm">Tutup</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  Layout.setContent(content);
  if (isAdmin) renderUserList();
}

async function saveGuruProfile(e) {
  e.preventDefault();
  const name = Utils.sanitizeInput(document.getElementById('gp-name').value);
  const mapel = Utils.sanitizeInput(document.getElementById('gp-mapel').value);
  const kelasAmpu = Utils.sanitizeInput(document.getElementById('gp-kelas').value);

  if (!name) {
    Utils.toast('Nama pengajar wajib diisi', 'error');
    return;
  }

  await DB.updateUser(session.userId, { name, mapel, kelasAmpu });
  Auth.updateSession({ name, mapel, kelasAmpu });
  Utils.toast('✅ Profil pengajar & bidang ampuan berhasil disimpan!', 'success');
  renderPengaturan();
}

function buildSysInfo() {
  const users = DB.getUsers();
  const soal = DB.getSoal();
  const ujian = DB.getUjian();
  const hasil = DB.getHasil();
  const logs = DB.getLogs();
  const totalStorageKB = Math.round(JSON.stringify(DB.all()).length / 1024);
  
  return [
    {icon:'👥', label:'Total Pengguna', val:users.length},
    {icon:'📚', label:'Total Soal', val:soal.length},
    {icon:'📋', label:'Total Ujian', val:ujian.length},
    {icon:'📊', label:'Total Hasil', val:hasil.length},
    {icon:'📋', label:'Total Log', val:logs.length},
    {icon:'💾', label:'Storage Terpakai', val:`~${totalStorageKB} KB`},
  ].map(s => `
  <div style="background:var(--gray-50);border-radius:var(--radius);padding:14px;text-align:center">
    <div style="font-size:24px;margin-bottom:4px">${s.icon}</div>
    <div style="font-size:20px;font-weight:700;color:var(--primary)">${s.val}</div>
    <div style="font-size:11px;color:var(--gray-500)">${s.label}</div>
  </div>`).join('');
}

function renderUserList() {
  const users = DB.getUsers();
  const container = document.getElementById('user-list-container');
  if (!container) return;
  
  if (users.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-title">Belum ada pengguna</div></div>';
    return;
  }
  
  container.innerHTML = `
  <div style="max-height:420px;overflow-y:auto">
    ${users.map(u => {
      let roleBadge = '🎓 Siswa';
      let avatarBg = 'var(--success-light)';
      let avatarColor = 'var(--success)';
      if (u.role === 'admin') {
        roleBadge = '🛡️ Administrator';
        avatarBg = 'var(--primary-light)';
        avatarColor = 'var(--primary-dark)';
      } else if (u.role === 'guru') {
        roleBadge = '👨‍🏫 Guru / Pendidik';
        avatarBg = 'var(--primary-pale)';
        avatarColor = 'var(--primary)';
      } else if (u.kelas) {
        roleBadge = '🎓 Siswa (' + Utils.escapeHtml(u.kelas) + ')';
      }
      return `
      <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--gray-100)">
        <div style="width:34px;height:34px;border-radius:50%;background:${avatarBg};color:${avatarColor};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:2px">${Utils.getInitials(u.name)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--gray-800)">${Utils.escapeHtml(u.name)}</div>
          <div style="font-size:11px;color:var(--gray-500)">${Utils.escapeHtml(u.username)} • ${roleBadge}</div>
          ${u.role === 'guru' ? `
          <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">
            ${u.mapel ? `<span class="badge badge-primary" style="font-size:10px">📚 ${Utils.escapeHtml(u.mapel)}</span>` : '<span class="badge badge-gray" style="font-size:10px">📚 Mapel: -</span>'}
            ${u.kelasAmpu ? `<span class="badge badge-success" style="font-size:10px">👥 Kelas: ${Utils.escapeHtml(u.kelasAmpu)}</span>` : '<span class="badge badge-gray" style="font-size:10px">👥 Kelas: -</span>'}
          </div>` : ''}
        </div>
        <div style="display:flex;gap:4px">
          <button onclick="openEditUserModal('${u.id}')" class="btn btn-icon btn-sm btn-outline" title="Edit">✏️</button>
          ${u.username !== 'admin' && u.id !== session.userId ? `<button onclick="deleteUser('${u.id}')" class="btn btn-icon btn-sm" style="background:var(--danger-light);color:var(--danger)" title="Hapus">🗑️</button>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

let editingUserId = null;

function openAddUserModal() {
  editingUserId = null;
  document.getElementById('modal-user-title').textContent = 'Tambah Pengguna';
  document.getElementById('add-user-body').innerHTML = buildUserForm();
  document.getElementById('modal-add-user').style.display = 'flex';
  toggleRoleFields();
}

function openEditUserModal(id) {
  editingUserId = id;
  const user = (DB.getUserById ? DB.getUserById(id) : null) || DB.getUsers().find(u => u.id === id);
  if (!user) {
    Utils.toast('Pengguna tidak ditemukan', 'error');
    return;
  }
  document.getElementById('modal-user-title').textContent = `Edit Pengguna: ${user.name}`;
  document.getElementById('add-user-body').innerHTML = buildUserForm(user);
  document.getElementById('modal-add-user').style.display = 'flex';
  toggleRoleFields();
}

function buildUserForm(user = null) {
  const isEdit = Boolean(user);
  const role = user?.role || 'siswa';
  return `
    <form onsubmit="saveUser(event)" novalidate>
      <div class="form-group">
        <label class="form-label">Peran Akun <span class="required">*</span></label>
        <select id="nu-role" class="form-control" onchange="toggleRoleFields()" ${isEdit && user.username==='admin'?'disabled':''}>
          <option value="siswa" ${role==='siswa'?'selected':''}>🎓 Siswa (Peserta Ujian)</option>
          <option value="guru" ${role==='guru'?'selected':''}>👨‍🏫 Guru (Pendidik / Pengelola Ujian)</option>
          <option value="admin" ${role==='admin'?'selected':''}>🛡️ Administrator (Akses Penuh & Pembuat Akun)</option>
        </select>
        ${isEdit && user.username==='admin' ? '<input type="hidden" id="nu-role-hidden" value="admin"/>' : ''}
      </div>
      <div class="form-group">
        <label class="form-label">Nama Lengkap <span class="required">*</span></label>
        <input type="text" id="nu-name" class="form-control" placeholder="Masukkan nama lengkap" value="${Utils.escapeHtml(user?.name||'')}" maxlength="100"/>
      </div>
      <div class="form-group">
        <label class="form-label">Username <span class="required">*</span></label>
        <input type="text" id="nu-username" class="form-control" placeholder="Username unik (tanpa spasi)" value="${Utils.escapeHtml(user?.username||'')}" ${isEdit?'readonly style="background:var(--gray-100);cursor:not-allowed"':''} maxlength="50"/>
      </div>
      <div class="form-group">
        <label class="form-label">${isEdit ? 'Password / PIN Baru (kosongkan jika tidak diubah)' : 'Password / PIN <span class="required">*</span>'}</label>
        <input type="text" id="nu-password" class="form-control" placeholder="${isEdit ? 'Biarkan kosong jika tidak diubah' : 'Minimal 4 karakter'}" maxlength="100"/>
      </div>

      <!-- Siswa: Kelas -->
      <div class="form-group" id="field-siswa-kelas">
        <label class="form-label">Kelas Siswa</label>
        <input type="text" id="nu-kelas" class="form-control" value="${Utils.escapeHtml(user?.kelas||'')}" placeholder="e.g. XI IPA 1" maxlength="50"/>
      </div>

      <!-- Guru: Mapel & Kelas Ampuan -->
      <div class="form-group" id="field-guru-mapel" style="display:none">
        <label class="form-label">Mata Pelajaran yang Diampu</label>
        <div style="font-size:11px;color:var(--gray-500);margin-bottom:6px">Pilihan cepat mata pelajaran:</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">
          ${COMMON_MAPEL.map(m => `<button type="button" class="btn btn-ghost btn-xs" style="padding:2px 8px;font-size:11px;border:1px solid var(--gray-300)" onclick="toggleTagInInput('nu-mapel', '${m}')">+ ${m}</button>`).join('')}
        </div>
        <input type="text" id="nu-mapel" class="form-control" value="${Utils.escapeHtml(user?.mapel||'')}" placeholder="e.g. Informatika, Matematika" maxlength="200"/>
      </div>

      <div class="form-group" id="field-guru-kelas" style="display:none">
        <label class="form-label">Kelas yang Diampu</label>
        <div style="font-size:11px;color:var(--gray-500);margin-bottom:6px">Pilihan cepat kelas:</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">
          ${COMMON_KELAS.map(k => `<button type="button" class="btn btn-ghost btn-xs" style="padding:2px 8px;font-size:11px;border:1px solid var(--gray-300)" onclick="toggleTagInInput('nu-kelas-ampu', '${k}')">+ ${k}</button>`).join('')}
        </div>
        <input type="text" id="nu-kelas-ampu" class="form-control" value="${Utils.escapeHtml(user?.kelasAmpu||'')}" placeholder="e.g. 8A, 8B, 91" maxlength="200"/>
      </div>

      <div class="modal-footer" style="padding:0;border:none;margin-top:16px">
        <button type="button" onclick="closeUserModal()" class="btn btn-secondary">Batal</button>
        <button type="submit" class="btn btn-primary">${isEdit ? '💾 Simpan Perubahan' : '➕ Tambah Pengguna'}</button>
      </div>
    </form>`;
}

function closeUserModal() {
  document.getElementById('modal-add-user').style.display = 'none';
  editingUserId = null;
}

function toggleRoleFields() {
  const hiddenRole = document.getElementById('nu-role-hidden')?.value;
  const role = hiddenRole || document.getElementById('nu-role')?.value || 'siswa';
  const siswaField = document.getElementById('field-siswa-kelas');
  const guruMapelField = document.getElementById('field-guru-mapel');
  const guruKelasField = document.getElementById('field-guru-kelas');

  if (siswaField) siswaField.style.display = role === 'siswa' ? 'block' : 'none';
  if (guruMapelField) guruMapelField.style.display = role === 'guru' ? 'block' : 'none';
  if (guruKelasField) guruKelasField.style.display = role === 'guru' ? 'block' : 'none';
}

async function saveUser(e) {
  e.preventDefault();
  if (session.role !== 'admin') {
    Utils.toast('Hanya Administrator yang memiliki hak membuat atau mengedit akun', 'error');
    return;
  }
  const name = Utils.sanitizeInput(document.getElementById('nu-name').value);
  const username = Utils.sanitizeInput(document.getElementById('nu-username').value);
  const password = document.getElementById('nu-password').value;
  const hiddenRole = document.getElementById('nu-role-hidden')?.value;
  const role = hiddenRole || document.getElementById('nu-role').value;
  const kelas = role === 'siswa' ? Utils.sanitizeInput(document.getElementById('nu-kelas').value) : '';
  const mapel = role === 'guru' ? Utils.sanitizeInput(document.getElementById('nu-mapel')?.value || '') : '';
  const kelasAmpu = role === 'guru' ? Utils.sanitizeInput(document.getElementById('nu-kelas-ampu')?.value || '') : '';
  
  if (!name || !username) { Utils.toast('Nama dan username wajib diisi', 'error'); return; }
  
  if (!editingUserId) {
    if (!password) { Utils.toast('Password wajib diisi untuk pengguna baru', 'error'); return; }
    if (password.length < 4) { Utils.toast('Password minimal 4 karakter', 'error'); return; }
    const existing = DB.getUsers().find(u => u.username === username);
    if (existing) { Utils.toast('Username sudah digunakan', 'error'); return; }

    await DB.addUser({ name, username, password, role, kelas, mapel, kelasAmpu, active: true });
    Utils.toast(`Akun ${role.toUpperCase()} "${name}" berhasil dibuat`, 'success');
  } else {
    const existing = (DB.getUserById ? DB.getUserById(editingUserId) : null) || DB.getUsers().find(u => u.id === editingUserId);
    const updateData = {
      name,
      username: existing?.username || username,
      role,
      kelas,
      mapel,
      kelasAmpu
    };
    if (password && password.trim()) {
      if (password.length < 4) {
        Utils.toast('Password baru minimal 4 karakter jika ingin diubah', 'error');
        return;
      }
      updateData.password = password;
    }
    await DB.updateUser(editingUserId, updateData);
    if (session && editingUserId === session.userId) {
      Auth.updateSession({ name, role, kelas, mapel, kelasAmpu });
    }
    Utils.toast(`Akun "${name}" berhasil diperbarui`, 'success');
  }

  closeUserModal();
  renderUserList();
}

function deleteUser(id) {
  Utils.confirm('Hapus Pengguna', 'Yakin ingin menghapus pengguna ini?', () => {
    DB.deleteUser(id);
    Utils.toast('Pengguna berhasil dihapus', 'success');
    renderUserList();
  });
}

function toggleSetting(el, key) {
  el.classList.toggle('on');
  const isOn = el.classList.contains('on');
  el.querySelector('.toggle-thumb').style.left = isOn ? '22px' : '2px';
  saveSetting(key, isOn);
}

function saveSetting(key, value) {
  const settings = DB.getSettings();
  settings[key] = value;
  DB.saveSettings(settings);
  Utils.toast('Pengaturan tersimpan', 'success');
}

function resetData() {
  Utils.confirm('Reset Semua Data', 'PERINGATAN: Tindakan ini akan menghapus SEMUA data termasuk ujian, soal, hasil, dan pengguna. Tidak dapat dibatalkan!', () => {
    Object.keys(localStorage).filter(k => k.startsWith('ulangan_')).forEach(k => localStorage.removeItem(k));
    Utils.toast('Semua data berhasil direset', 'success');
    setTimeout(() => window.location.href = '../index.html', 1000);
  });
}

async function seedDemoData() {
  Utils.confirm('Isi Data Contoh', 'Apakah Anda yakin ingin mengisi data contoh (guru, siswa, bank soal, dan ujian)?', async () => {
    Utils.toast('Memproses data contoh...', 'info');
    DB.remove('seeded');
    await DB.seed();
    Utils.toast('✅ Data contoh berhasil disiapkan!', 'success');
    renderPengaturan();
  }, 'primary');
}

function exportAllData() {
  const data = DB.all();
  const json = JSON.stringify(data, null, 2);
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
  a.download = `backup-ulangan-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  Utils.toast('Backup berhasil didownload', 'success');
}

function saveSupabaseConfig() {
  const url = document.getElementById('sb-url').value.trim();
  const anonKey = document.getElementById('sb-key').value.trim();
  if (!url || !anonKey) {
    Utils.toast('URL dan Anon Key wajib diisi', 'error');
    return;
  }
  DB.setSupabaseConfig({ url, anonKey });
  Utils.toast('Konfigurasi Supabase disimpan! Menguji koneksi...', 'info');
  testSupabaseConn();
}

async function testSupabaseConn() {
  const res = await DB.testConnection();
  const badge = document.getElementById('supabase-status-badge');
  if (res.success) {
    Utils.toast('✅ Berhasil terhubung ke Supabase Cloud!', 'success');
    if (badge) badge.innerHTML = '<span class="badge badge-success" style="font-size:12px;padding:6px 12px">🟢 Terhubung ke Cloud</span>';
  } else {
    Utils.toast('❌ Koneksi gagal: ' + (res.error || 'Periksa URL dan Anon Key'), 'error');
    if (badge) badge.innerHTML = '<span class="badge badge-danger" style="font-size:12px;padding:6px 12px">🔴 Gagal Terhubung</span>';
  }
}

async function syncSupabaseData() {
  Utils.toast('☁️ Menyinkronkan data dari cloud...', 'info');
  const ok = await DB.syncFromSupabase();
  if (ok) {
    Utils.toast('✅ Data berhasil disinkronkan!', 'success');
    renderPengaturan();
  } else {
    Utils.toast('Gagal menyinkronkan data cloud', 'error');
  }
}

async function showSqlModal() {
  try {
    const res = await fetch('../supabase_schema.sql');
    const sql = await res.text();
    document.getElementById('sql-ddl-text').value = sql;
  } catch (e) {
    document.getElementById('sql-ddl-text').value = '-- File supabase_schema.sql tersedia di direktori proyek.';
  }
  document.getElementById('modal-sql').style.display = 'flex';
}

function closeSqlModal() {
  document.getElementById('modal-sql').style.display = 'none';
}

function copySqlDDL() {
  const ta = document.getElementById('sql-ddl-text');
  ta.select();
  navigator.clipboard.writeText(ta.value).then(() => {
    Utils.toast('Skrip SQL berhasil disalin ke clipboard!', 'success');
  });
}

document.addEventListener('click', e => {
  if (e.target === document.getElementById('modal-add-user')) closeUserModal();
  if (e.target === document.getElementById('modal-sql')) closeSqlModal();
});
</script>
</body>
</html>
