<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengaturan - Ulangan Digital</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="stylesheet" href="../css/style.css?v=2.2"/>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/storage.js?v=2.2"></script>
<script src="../js/utils.js?v=2.2"></script>
<script src="../js/auth.js?v=2.2"></script>
<script src="../js/layout.js?v=2.2"></script>
<script>
DB.init();
Auth.init();
const session = Layout.initStaff('pengaturan', ['admin', 'guru']);

const COMMON_MAPEL = ['Informatika', 'Matematika', 'Bahasa Indonesia', 'Bahasa Inggris', 'IPA', 'IPS', 'Fisika', 'Kimia', 'Biologi', 'PJOK', 'PKN', 'Seni Budaya', 'PAI / Agama'];
const COMMON_KELAS = ['7A', '7B', '7C', '8A', '8B', '8C', '9A', '9B', '9C', 'X IPA 1', 'XI IPA 1', 'XII IPA 1'];

let userFilterRole = 'semua';
let userFilterKelas = 'semua';
let userSearchQuery = '';
let userSortBy = 'default';
let editingUserId = null;
let parsedSiswaBatch = [];

function toggleTagInInput(inputId, tag) {
  const input = document.getElementById(inputId);
  if (!input) return;
  let items = input.value.split(',').map(s => s.trim()).filter(Boolean);
  const idx = items.findIndex(item => item.toLowerCase() === tag.toLowerCase());
  if (idx >= 0) {
    items.splice(idx, 1);
  } else {
    items.push(tag);
  }
  input.value = items.join(', ');
}

try {
  if (session) renderPengaturan();
} catch (err) {
  console.error('Error rendering Pengaturan:', err);
  Layout.setContent(`
    <div class="alert alert-danger" style="margin:24px">
      <span class="alert-icon">❌</span>
      <div><strong>Gagal memuat Pengaturan:</strong> ${Utils.escapeHtml(err.message)}</div>
    </div>
  `);
}

function renderPengaturan() {
  Layout.setPageTitle('Pengaturan');
  const settings = DB.getSettings();
  const isAdmin = session.role === 'admin';
  const isGuru = session.role === 'guru';

  const teacherMapel = session.mapel || '';
  const teacherKelas = session.kelasAmpu || '';

  // Hitung cakupan untuk guru
  const myMapels = DB.getGuruMapels(session);
  const myKelas = DB.getGuruKelas(session);
  const mySoalCount = DB.getSoal().filter(s => DB.isGuruMatch(session, s.mapel, s.kelas) || s.pembuatId === session.userId).length;
  const myUjianCount = DB.getUjian().filter(u => DB.isGuruMatch(session, u.mapel, u.kelas) || u.guruId === session.userId).length;

  const content = `
  <div class="animate-fade-in">
    <div class="mb-6">
      <h1 class="page-title">${isAdmin ? 'Pengaturan Sistem & Pengguna' : 'Profil Pengajar & Pengaturan'}</h1>
      <p class="page-subtitle">${isAdmin ? 'Konfigurasi sistem, database cloud, Exam Mode, dan manajemen akun guru & siswa' : 'Kelola identitas, mata pelajaran, dan kelas yang Anda ampu'}</p>
    </div>

    <!-- Profil Pengajar & Bidang Ampuan (Khusus Guru / Admin) -->
    <div class="card mb-6" style="border: 1.5px solid var(--primary-light); background: linear-gradient(to right, #FFFFFF, #F8FAFC)">
      <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:28px">👨‍🏫</span>
          <div>
            <h3 class="card-title" style="margin:0">Profil Pengajar & Bidang Ampuan</h3>
            <div style="font-size:12px;color:var(--gray-500)">Atur Mata Pelajaran dan Kelas yang Anda ampu agar bank soal dan ujian otomatis terfilter</div>
          </div>
        </div>
        <span class="badge ${isAdmin ? 'badge-primary' : 'badge-success'}" style="font-size:12px;padding:6px 12px">
          ${isAdmin ? '🛡️ Administrator' : '👨‍🏫 Guru / Pendidik'}
        </span>
      </div>
      <div style="padding:16px 0 0 0">
        <form onsubmit="saveGuruProfile(event)" novalidate>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="mb-4">
            <div>
              <label class="form-label" style="font-weight:600">Nama Lengkap <span class="required">*</span></label>
              <input type="text" id="gp-name" class="form-control" value="${Utils.escapeHtml(session.name)}" placeholder="Nama Lengkap dengan Gelar" maxlength="100" />
            </div>
            <div>
              <label class="form-label" style="font-weight:600">Username Login</label>
              <input type="text" class="form-control" value="${Utils.escapeHtml(session.username)}" readonly disabled style="background:var(--gray-100);cursor:not-allowed" />
            </div>
          </div>

          <div class="form-group mb-4">
            <label class="form-label" style="font-weight:600">Mata Pelajaran yang Diampu</label>
            <div style="font-size:11px;color:var(--gray-500);margin-bottom:6px">Klik tag di bawah untuk menambah/menghapus secara cepat, atau ketik langsung (pisahkan dengan koma):</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
              ${COMMON_MAPEL.map(m => {
                const isActive = myMapels.some(item => item.toLowerCase() === m.toLowerCase());
                return `<button type="button" class="btn ${isActive ? 'btn-primary' : 'btn-outline'} btn-xs" style="padding:4px 10px;font-size:11px;border-radius:20px" onclick="toggleTagInInput('gp-mapel', '${m}')">${isActive ? '✓ ' : '+ '}${m}</button>`;
              }).join('')}
            </div>
            <input type="text" id="gp-mapel" class="form-control" value="${Utils.escapeHtml(teacherMapel)}" placeholder="Contoh: Informatika, Matematika" maxlength="200" />
          </div>

          <div class="form-group mb-4">
            <label class="form-label" style="font-weight:600">Kelas yang Diampu</label>
            <div style="font-size:11px;color:var(--gray-500);margin-bottom:6px">Pilih kelas yang Anda ajar (pisahkan dengan koma):</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
              ${COMMON_KELAS.map(k => {
                const isActive = myKelas.some(item => item.toLowerCase() === k.toLowerCase());
                return `<button type="button" class="btn ${isActive ? 'btn-primary' : 'btn-outline'} btn-xs" style="padding:4px 10px;font-size:11px;border-radius:20px" onclick="toggleTagInInput('gp-kelas', '${k}')">${isActive ? '✓ ' : '+ '}${k}</button>`;
              }).join('')}
            </div>
            <input type="text" id="gp-kelas" class="form-control" value="${Utils.escapeHtml(teacherKelas)}" placeholder="Contoh: 8A, 8B, 91, XI IPA 1" maxlength="200" />
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--gray-200);padding-top:16px">
            <div style="font-size:12px;color:var(--gray-500)">
              Data mapel & kelas akan otomatis tersinkron ke cloud Supabase dan menjadi filter utama Anda.
            </div>
            <button type="submit" class="btn btn-primary">💾 Simpan Profil & Bidang Ampuan</button>
          </div>
        </form>
      </div>
    </div>

    ${isGuru ? `
    <!-- Ringkasan Ruang Lingkup Guru -->
    <div class="card mb-6">
      <div class="card-header"><h3 class="card-title">📊 Ruang Lingkup & Statistik Anda</h3></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
        <div style="background:var(--primary-pale);border-radius:var(--radius);padding:14px;text-align:center">
          <div style="font-size:24px;margin-bottom:4px">📚</div>
          <div style="font-size:20px;font-weight:700;color:var(--primary)">${myMapels.length ? myMapels.join(', ') : '-'}</div>
          <div style="font-size:11px;color:var(--gray-500)">Mata Pelajaran Aktif</div>
        </div>
        <div style="background:var(--success-light);border-radius:var(--radius);padding:14px;text-align:center">
          <div style="font-size:24px;margin-bottom:4px">👥</div>
          <div style="font-size:20px;font-weight:700;color:var(--success)">${myKelas.length ? myKelas.join(', ') : 'Semua'}</div>
          <div style="font-size:11px;color:var(--gray-500)">Kelas Ampuan</div>
        </div>
        <div style="background:var(--gray-50);border-radius:var(--radius);padding:14px;text-align:center">
          <div style="font-size:24px;margin-bottom:4px">📝</div>
          <div style="font-size:20px;font-weight:700;color:var(--primary-dark)">${mySoalCount} Soal</div>
          <div style="font-size:11px;color:var(--gray-500)">Soal Relevan di Bank Soal</div>
        </div>
        <div style="background:var(--gray-50);border-radius:var(--radius);padding:14px;text-align:center">
          <div style="font-size:24px;margin-bottom:4px">📋</div>
          <div style="font-size:20px;font-weight:700;color:var(--primary-dark)">${myUjianCount} Ujian</div>
          <div style="font-size:11px;color:var(--gray-500)">Ujian Terjadwal Anda</div>
        </div>
      </div>
    </div>
    ` : ''}

    ${isAdmin ? `
    <!-- Integrasi Supabase Cloud -->
    <div class="card mb-6" style="border: 1.5px solid var(--primary-light); background: linear-gradient(to right, #F8FAFC, #EFF6FF)">
      <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:24px">☁️</span>
          <div>
            <h3 class="card-title" style="margin:0">Integrasi Database Cloud (Supabase)</h3>
            <div style="font-size:12px;color:var(--gray-500)">Sinkronisasi Bank Soal, Autosave Jawaban, Auth Guru & Siswa, serta Audit Log di Cloud</div>
          </div>
        </div>
        <div id="supabase-status-badge">
          ${DB.isConnected
            ? '<span class="badge badge-success" style="font-size:12px;padding:6px 12px">🟢 Terhubung ke Cloud</span>'
            : '<span class="badge badge-warning" style="font-size:12px;padding:6px 12px">🟡 Mode Lokal / Belum Diatur</span>'}
        </div>
      </div>
      <div style="padding:16px 0 0 0">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="mb-4">
          <div>
            <label class="form-label" style="font-weight:600">Supabase Project URL <span class="required">*</span></label>
            <input type="text" id="sb-url" class="form-control" placeholder="https://xyzcompany.supabase.co" value="${Utils.escapeHtml(DB.getSupabaseConfig().url || '')}" />
            <div style="font-size:11px;color:var(--gray-400);margin-top:4px">Didapatkan dari Supabase Dashboard ➔ Project Settings ➔ API</div>
          </div>
          <div>
            <label class="form-label" style="font-weight:600">Supabase Anon Public Key <span class="required">*</span></label>
            <input type="password" id="sb-key" class="form-control" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." value="${Utils.escapeHtml(DB.getSupabaseConfig().anonKey || '')}" />
            <div style="font-size:11px;color:var(--gray-400);margin-top:4px">Kunci anon / public client (Aman digunakan di browser)</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button onclick="saveSupabaseConfig()" class="btn btn-primary btn-sm">💾 Simpan & Hubungkan</button>
          <button onclick="testSupabaseConn()" class="btn btn-outline btn-sm">🔄 Uji Koneksi</button>
          <button onclick="syncSupabaseData()" class="btn btn-secondary btn-sm">☁️ Tarik Data Terbaru</button>
          <button onclick="showSqlModal()" class="btn btn-ghost btn-sm" style="color:var(--primary)">📋 Lihat Skrip SQL DDL</button>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
      <!-- Exam Mode Settings -->
      <div class="card">
        <div class="card-header"><h3 class="card-title">🛡️ Pengaturan Exam Mode</h3></div>
        <div class="settings-section">
          <div class="settings-section-title">Keamanan Ujian</div>
          
          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Wajib Fullscreen</div>
              <div class="hint">Siswa harus dalam mode fullscreen saat ujian</div>
            </div>
            <div class="settings-item-control">
              <div class="toggle-track ${settings.requireFullscreen?'on':''}" id="t-fullscreen" onclick="toggleSetting(this,'requireFullscreen')"><div class="toggle-thumb" style="left:${settings.requireFullscreen?'22':'2'}px"></div></div>
            </div>
          </div>

          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Maks. Pelanggaran (Default)</div>
              <div class="hint">Jumlah pelanggaran sebelum ujian ditangguhkan</div>
            </div>
            <div class="settings-item-control">
              <input type="number" id="s-max-violations" class="form-control" value="${settings.maxViolations||3}" min="1" max="20" style="width:70px;text-align:center" onchange="saveSetting('maxViolations',parseInt(this.value))"/>
            </div>
          </div>

          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Interval Autosave (detik)</div>
              <div class="hint">Seberapa sering jawaban disimpan otomatis</div>
            </div>
            <div class="settings-item-control">
              <input type="number" id="s-autosave" class="form-control" value="${settings.autosaveInterval||30}" min="10" max="300" style="width:80px;text-align:center" onchange="saveSetting('autosaveInterval',parseInt(this.value))"/>
            </div>
          </div>

          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Izinkan Tandai Soal</div>
              <div class="hint">Siswa dapat menandai soal untuk ditinjau ulang</div>
            </div>
            <div class="settings-item-control">
              <div class="toggle-track ${settings.allowFlagQuestion?'on':''}" id="t-flag" onclick="toggleSetting(this,'allowFlagQuestion')"><div class="toggle-thumb" style="left:${settings.allowFlagQuestion?'22':'2'}px"></div></div>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">Hasil Ujian</div>
          
          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Izinkan Review Soal</div>
              <div class="hint">Siswa bisa kembali ke soal sebelumnya</div>
            </div>
            <div class="settings-item-control">
              <div class="toggle-track ${settings.allowReview?'on':''}" id="t-review" onclick="toggleSetting(this,'allowReview')"><div class="toggle-thumb" style="left:${settings.allowReview?'22':'2'}px"></div></div>
            </div>
          </div>

          <div class="settings-item">
            <div class="settings-item-info">
              <div class="label">Tampilkan Nilai Langsung</div>
              <div class="hint">Siswa dapat melihat nilai setelah submit (default global)</div>
            </div>
            <div class="settings-item-control">
              <div class="toggle-track ${settings.showScoreImmediately?'on':''}" id="t-score" onclick="toggleSetting(this,'showScoreImmediately')"><div class="toggle-thumb" style="left:${settings.showScoreImmediately?'22':'2'}px"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Manajemen Pengguna -->
      <div class="card">
        <div class="card-header">
          <div>
            <h3 class="card-title">👥 Manajemen Pengguna</h3>
            <div style="font-size:12px;color:var(--gray-500)">Kelola akun Administrator, Guru (mapel & kelas ampu), dan Siswa berdasarkan kelas & no. absen</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" onclick="openImportSiswaModal()" class="btn btn-sm btn-outline">📥 Import Siswa (Excel / CSV)</button>
            <button type="button" onclick="openAddUserModal()" class="btn btn-sm btn-primary">➕ Tambah Pengguna</button>
          </div>
        </div>
        <div id="user-list-container"></div>
      </div>
    </div>

    <!-- Informasi Sistem -->
    <div class="card mt-6">
      <div class="card-header"><h3 class="card-title">ℹ️ Informasi Sistem</h3></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
        ${buildSysInfo()}
      </div>
      <div class="divider"></div>
      <div class="alert alert-warning">
        <span class="alert-icon">⚠️</span>
        <div><strong>Catatan Keamanan Exam Mode:</strong> Web browser biasa tidak dapat menjamin penguncian perangkat 100%. Untuk keamanan tingkat perangkat, gunakan kiosk browser atau managed-device mode (misalnya: Chrome Kiosk Mode, Safe Exam Browser).</div>
      </div>
      <div class="alert alert-info mt-4">
        <span class="alert-icon">🔒</span>
        <div><strong>Proteksi yang Diimplementasikan:</strong> Page Visibility API, Fullscreen Detection, Window Blur/Focus, Keyboard Shortcut Blocking (F12, DevTools, Print), Context Menu Disabled, Copy/Paste Disabled, Browser Back Button Detection, Autosave setiap ${settings.autosaveInterval||30} detik.</div>
      </div>
      <div class="mt-4" style="display:flex;gap:10px;flex-wrap:wrap">
        <button onclick="resetData()" class="btn btn-danger btn-sm">⚠️ Reset Semua Data</button>
        <button onclick="exportAllData()" class="btn btn-outline btn-sm">📦 Backup Data</button>
        <button onclick="seedDemoData()" class="btn btn-secondary btn-sm">🌱 Isi Data Contoh (Demo)</button>
      </div>
    </div>
    ` : `
    <!-- Keamanan Ujian Info untuk Guru -->
    <div class="card mt-6">
      <div class="card-header"><h3 class="card-title">🛡️ Informasi Proteksi & Keamanan Exam Mode</h3></div>
      <div class="alert alert-info">
        <span class="alert-icon">🔒</span>
        <div><strong>Proteksi Ujian Aktif:</strong> Siswa diwajibkan masuk Fullscreen, keluar fullscreen atau membuka tab lain dicatat sebagai pelanggaran pada Audit Log, dan jawaban siswa otomatis tersimpan (autosave) secara berkala ke cloud.</div>
      </div>
    </div>
    `}

    <!-- Modal Tambah / Edit User -->
    <div id="modal-add-user" class="modal-backdrop" style="display:none">
      <div class="modal modal-lg">
        <div class="modal-header">
          <h3 class="modal-title" id="modal-user-title">Tambah Pengguna</h3>
          <button class="modal-close" onclick="closeUserModal()">✕</button>
        </div>
        <div class="modal-body" id="add-user-body"></div>
      </div>
    </div>

    <!-- Modal Import Siswa Massal -->
    <div id="modal-import-siswa" class="modal-backdrop" style="display:none">
      <div class="modal modal-xl">
        <div class="modal-header">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:24px">📥</span>
            <div>
              <h3 class="modal-title" style="margin:0">Import Akun Siswa (Excel / CSV)</h3>
              <div style="font-size:12px;color:var(--gray-500)">Tambah ratusan akun siswa sekaligus dari file Excel (.xlsx, .xls) atau CSV</div>
            </div>
          </div>
          <button class="modal-close" onclick="closeImportSiswaModal()">✕</button>
        </div>
        <div class="modal-body" style="max-height:75vh;overflow-y:auto">
          <!-- Step 1: Download Template -->
          <div style="background:var(--primary-pale);border:1px solid var(--primary-light);border-radius:var(--radius);padding:14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
            <div>
              <div style="font-weight:700;color:var(--primary-dark);font-size:14px">💡 Belum memiliki format data siswa?</div>
              <div style="font-size:12px;color:var(--gray-600)">Unduh template resmi berikut, lalu salin/masukkan data siswa Anda:</div>
            </div>
            <div style="display:flex;gap:8px">
              <button type="button" onclick="downloadTemplateExcel()" class="btn btn-sm btn-primary">📥 Unduh Template Excel (.xlsx)</button>
              <button type="button" onclick="downloadTemplateCSV()" class="btn btn-sm btn-outline">📄 Unduh Template CSV</button>
            </div>
          </div>

          <!-- Step 2: Upload Zone -->
          <div id="drop-zone-siswa" style="border:2px dashed var(--primary);border-radius:var(--radius);padding:30px 20px;text-align:center;background:#F8FAFC;cursor:pointer;transition:all 0.2s" onclick="document.getElementById('file-input-siswa').click()">
            <div style="font-size:36px;margin-bottom:8px">📂</div>
            <div style="font-size:15px;font-weight:700;color:var(--gray-800)">Klik untuk pilih file Excel / CSV, atau seret file ke sini</div>
            <div style="font-size:12px;color:var(--gray-500);margin-top:4px">Mendukung format <strong>.xlsx, .xls, .csv</strong> (Kolom: NIS/Username, Nama, Password, Kelas, No Absen)</div>
            <input type="file" id="file-input-siswa" accept=".xlsx, .xls, .csv" style="display:none" onchange="handleSiswaFileSelect(event)" />
          </div>

          <!-- Step 3: Preview Container (Hidden initially) -->
          <div id="import-preview-container" style="display:none;margin-top:20px">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:18px">📊</span>
                <span id="import-summary-text" style="font-weight:700;font-size:14px;color:var(--gray-800)">0 Siswa Terdeteksi</span>
                <span id="import-file-badge" class="badge badge-primary">siswa.xlsx</span>
              </div>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
                <input type="checkbox" id="import-overwrite-check" checked style="cursor:pointer"/>
                <span>Perbarui akun jika NIS/Username sudah ada</span>
              </label>
            </div>

            <!-- Preview Table -->
            <div style="max-height:260px;overflow-y:auto;overflow-x:auto;border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:16px">
              <table style="width:100%;min-width:640px;font-size:12px;border-collapse:collapse;text-align:left">
                <thead style="background:var(--gray-100);position:sticky;top:0">
                  <tr>
                    <th style="padding:8px 12px;border-bottom:1px solid var(--gray-200)">#</th>
                    <th style="padding:8px 12px;border-bottom:1px solid var(--gray-200)">NIS / Username</th>
                    <th style="padding:8px 12px;border-bottom:1px solid var(--gray-200)">Nama Lengkap</th>
                    <th style="padding:8px 12px;border-bottom:1px solid var(--gray-200)">Kelas</th>
                    <th style="padding:8px 12px;border-bottom:1px solid var(--gray-200)">No Absen</th>

async function saveGuruProfile(e) {
  e.preventDefault();
  const name = Utils.sanitizeInput(document.getElementById('gp-name').value);
  const mapel = Utils.sanitizeInput(document.getElementById('gp-mapel').value);
  const kelasAmpu = Utils.sanitizeInput(document.getElementById('gp-kelas').value);

  if (!name) {
    Utils.toast('Nama pengajar wajib diisi', 'error');
    return;
  }

  await DB.updateUser(session.userId, { name, mapel, kelasAmpu });
  Auth.updateSession({ name, mapel, kelasAmpu });
  Utils.toast('✅ Profil pengajar & bidang ampuan berhasil disimpan!', 'success');
  renderPengaturan();
}

function setUserFilterRole(role) {
  userFilterRole = role;
  if (role !== 'siswa' && role !== 'semua') {
    userFilterKelas = 'semua';
  }
  renderUserList();
}

function setUserFilterKelas(kelas) {
  userFilterKelas = kelas;
  renderUserList();
}

function handleUserSearch(val) {
  userSearchQuery = val;
  renderFilteredUserItems();
}

function clearUserSearch() {
  userSearchQuery = '';
  const input = document.getElementById('user-search-input');
  if (input) input.value = '';
  renderFilteredUserItems();
}

function resetUserFilters() {
  userFilterRole = 'semua';
  userFilterKelas = 'semua';
  userSearchQuery = '';
  userSortBy = 'default';
  renderUserList();
}

function renderClassAuditBanner(kelasName, students) {
  if (!students || students.length === 0) return '';

  const withoutAbsen = students.filter(s => !(s.noAbsen || s.no_absen || '').trim());
  const absenNums = students
    .map(s => parseInt(s.noAbsen || s.no_absen, 10))
    .filter(n => !isNaN(n) && n > 0);

  const freq = {};
  students.forEach(s => {
    const v = (s.noAbsen || s.no_absen || '').trim();
    if (v) freq[v] = (freq[v] || 0) + 1;
  });
  const duplicates = Object.keys(freq).filter(k => freq[k] > 1);

  const missingGaps = [];
  if (absenNums.length > 0) {
    const maxAbsen = Math.max(...absenNums);
    for (let i = 1; i <= maxAbsen; i++) {
      if (!absenNums.includes(i)) missingGaps.push(i);
    }
  }

  const hasIssues = missingGaps.length > 0 || duplicates.length > 0 || withoutAbsen.length > 0;

  if (hasIssues) {
    return `
      <div style="background:#FFFBEB;border:1px solid #F59E0B;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:#92400E">
        <div style="font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <span>⚠️ Audit Presensi Siswa Kelas ${Utils.escapeHtml(kelasName)}</span>
          <span style="font-weight:600;color:#78350F">${students.length} Siswa Terdaftar</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:3px;font-size:11.5px">
          ${missingGaps.length > 0 ? `
            <div>• <strong>Nomor Absen Terlewat (Belum Terdaftar):</strong> No. <strong>${missingGaps.slice(0, 15).join(', ')}${missingGaps.length > 15 ? '...' : ''}</strong>. Periksa apakah ada siswa yang belum dimasukkan!</div>
          ` : ''}
          ${duplicates.length > 0 ? `
            <div>• <strong>Nomor Absen Ganda:</strong> Ditemukan lebih dari 1 siswa dengan No. Absen <strong>${duplicates.join(', ')}</strong>.</div>
          ` : ''}
          ${withoutAbsen.length > 0 ? `
            <div>• <strong>Belum Ada No. Absen:</strong> Ada <strong>${withoutAbsen.length}</strong> siswa di kelas ini yang belum diisi nomor absennya.</div>
          ` : ''}
        </div>
      </div>
    `;
  }

  return `
    <div style="background:#F0FDF4;border:1px solid #86EFAC;border-radius:var(--radius);padding:8px 12px;margin-bottom:14px;font-size:12px;color:#166534;display:flex;align-items:center;justify-content:space-between">
      <div>
        ✅ <strong>Data Kelas ${Utils.escapeHtml(kelasName)} Lengkap:</strong> ${students.length} siswa terdaftar (Nomor absen 1 s/d ${Math.max(...absenNums, students.length)} lengkap tanpa nomor terlewat).
      </div>
    </div>
  `;
}

    return;

  const guruUsers = allUsers.filter(u => u.role === 'guru');

      </button>
      <button type="button" class="btn btn-sm ${userFilterRole==='guru'?'btn-primary':'btn-secondary'}" onclick="setUserFilterRole('guru')" style="font-weight:600">

      </button>
      <button type="button" class="btn btn-sm ${userFilterRole==='siswa'?'btn-primary':'btn-secondary'}" onclick="setUserFilterRole('siswa')" style="font-weight:600">
        🎓 Siswa (Peserta) <span class="badge" style="margin-left:6px;font-size:11px;background:${userFilterRole==='siswa'?'rgba(255,255,255,0.25)':'var(--gray-300)'};color:${userFilterRole==='siswa'?'#fff':'var(--gray-700)'}">${siswaUsers.length}</span>
      </button>
      <button type="button" class="btn btn-sm ${userFilterRole==='admin'?'btn-primary':'btn-secondary'}" onclick="setUserFilterRole('admin')" style="font-weight:600">
        🛡️ Administrator <span class="badge" style="margin-left:6px;font-size:11px;background:${userFilterRole==='admin'?'rgba(255,255,255,0.25)':'var(--gray-300)'};color:${userFilterRole==='admin'?'#fff':'var(--gray-700)'}">${adminUsers.length}</span>
      </button>
    </div>
  `;

  // Pemetaan dan Filter Kelas untuk Siswa
  if (userFilterRole === 'siswa' || (userFilterRole === 'semua' && detectedClasses.length > 0)) {
    html += `
      <div style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
          <div style="font-size:12px;font-weight:700;color:var(--gray-800);display:flex;align-items:center;gap:6px">
            <span>🏛️ Filter & Pemetaan Siswa Berdasarkan Kelas:</span>
            <span style="font-weight:normal;color:var(--gray-500);font-size:11px">(${detectedClasses.length} kelas, total ${siswaUsers.length} siswa)</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${unassignedSiswa.length > 0 ? `
              <span class="badge badge-warning" style="cursor:pointer;font-size:11px" onclick="setUserFilterKelas('__unassigned__')" title="Klik untuk memfilter siswa yang belum memiliki kelas">
                ⚠️ ${unassignedSiswa.length} Siswa Belum Ada Kelas

            ` : ''}
            ${missingAbsenCount > 0 ? `
              <span class="badge badge-info" style="font-size:11px" title="Siswa yang nomor absennya masih kosong">
                ℹ️ ${missingAbsenCount} Siswa Belum Diisi No. Absen

        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">

            Semua Kelas (${siswaUsers.length})

              ⚠️ Belum Ada Kelas (${unassignedSiswa.length})

      </div>

    if (userFilterKelas !== 'semua' && userFilterKelas !== '__unassigned__') {
      const classStudents = siswaUsers.filter(u => (u.kelas || '').trim().toLowerCase() === userFilterKelas.toLowerCase());
      html += renderClassAuditBanner(userFilterKelas, classStudents);
    } else if (userFilterKelas === '__unassigned__') {
      html += `
        <div style="background:#FFFBEB;border:1px solid #FCD34D;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:#92400E">

        </div>
      `;
    }
  }

  // Search & Sort Bar
  html += `
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <div style="flex:1;min-width:200px;position:relative">
        <input type="text" id="user-search-input" value="${Utils.escapeHtml(userSearchQuery)}" oninput="handleUserSearch(this.value)" placeholder="🔍 Cari nama, username / NIS, kelas, atau no. absen..." class="form-control" style="font-size:13px;padding-right:30px" />
        ${userSearchQuery ? `<button type="button" onclick="clearUserSearch()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:14px" title="Hapus pencarian">✕</button>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:12px;color:var(--gray-500);white-space:nowrap">Urutkan:</span>
        <select class="form-control" style="width:auto;font-size:12px;padding:6px 10px" onchange="userSortBy=this.value;renderFilteredUserItems()">
          <option value="default" ${userSortBy==='default'?'selected':''}>Urutan Bawaan</option>
          <option value="absen_asc" ${userSortBy==='absen_asc'?'selected':''}>📋 No. Absen (1 → 99)</option>
          <option value="absen_desc" ${userSortBy==='absen_desc'?'selected':''}>📋 No. Absen (99 → 1)</option>
          <option value="name_asc" ${userSortBy==='name_asc'?'selected':''}>🔤 Nama (A - Z)</option>
          <option value="kelas_asc" ${userSortBy==='kelas_asc'?'selected':''}>🏛️ Kelas & Absen</option>
        </select>
      </div>
    </div>
    <div id="user-count-info" style="font-size:12px;color:var(--gray-500);margin-bottom:8px"></div>
    <div id="user-list-rows" style="max-height:480px;overflow-y:auto"></div>
  `;

  container.innerHTML = html;
  renderFilteredUserItems();
}

function renderFilteredUserItems() {
  const rowsContainer = document.getElementById('user-list-rows');
  const countContainer = document.getElementById('user-count-info');
  if (!rowsContainer) return;

  const allUsers = DB.getUsers();
  let list = [...allUsers];

  if (userFilterRole !== 'semua') {
    list = list.filter(u => u.role === userFilterRole);
  }

  if (userFilterRole === 'siswa' || (userFilterRole === 'semua' && userFilterKelas !== 'semua')) {
    if (userFilterKelas === '__unassigned__') {
      list = list.filter(u => u.role === 'siswa' && !(u.kelas || '').trim());
    } else if (userFilterKelas !== 'semua') {
      list = list.filter(u => (u.kelas || '').trim().toLowerCase() === userFilterKelas.toLowerCase());
    }
  }

  if (userSearchQuery.trim()) {
    const q = userSearchQuery.trim().toLowerCase();
    list = list.filter(u =>
      (u.name || '').toLowerCase().includes(q) ||
      (u.username || '').toLowerCase().includes(q) ||
      (u.kelas || '').toLowerCase().includes(q) ||
      String(u.noAbsen || u.no_absen || '').toLowerCase().includes(q) ||
      (u.mapel || '').toLowerCase().includes(q) ||
      (u.kelasAmpu || '').toLowerCase().includes(q)
    );
  }

  list.sort((a, b) => {
    if (userSortBy === 'absen_asc' || (userFilterRole === 'siswa' && userSortBy === 'default')) {
      const numA = parseInt(a.noAbsen || a.no_absen, 10);
      const numB = parseInt(b.noAbsen || b.no_absen, 10);
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
      if (!isNaN(numA)) return -1;
      if (!isNaN(numB)) return 1;
      return (a.name || '').localeCompare(b.name || '');
    }
    if (userSortBy === 'absen_desc') {
      const numA = parseInt(a.noAbsen || a.no_absen, 10);
      const numB = parseInt(b.noAbsen || b.no_absen, 10);
      if (!isNaN(numA) && !isNaN(numB)) return numB - numA;
      if (!isNaN(numA)) return 1;
      if (!isNaN(numB)) return -1;
      return (b.name || '').localeCompare(a.name || '');
    }
    if (userSortBy === 'name_asc') {
      return (a.name || '').localeCompare(b.name || '');
    }
    if (userSortBy === 'kelas_asc') {
      const kA = a.kelas || '';
      const kB = b.kelas || '';
      if (kA !== kB) return kA.localeCompare(kB, undefined, { numeric: true });
      const numA = parseInt(a.noAbsen || a.no_absen, 10);
      const numB = parseInt(b.noAbsen || b.no_absen, 10);
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
      return (a.name || '').localeCompare(b.name || '');
    }
    const roleOrder = { admin: 1, guru: 2, siswa: 3 };
    const rDiff = (roleOrder[a.role] || 4) - (roleOrder[b.role] || 4);
    if (rDiff !== 0) return rDiff;
    if (a.role === 'siswa') {
      const kDiff = (a.kelas || '').localeCompare(b.kelas || '', undefined, { numeric: true });
      if (kDiff !== 0) return kDiff;
      const numA = parseInt(a.noAbsen || a.no_absen, 10);
      const numB = parseInt(b.noAbsen || b.no_absen, 10);
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
    }
    return (a.name || '').localeCompare(b.name || '');
  });

  if (countContainer) {
    countContainer.innerHTML = `Menampilkan <strong>${list.length}</strong> dari total ${allUsers.length} pengguna`;
  }

  if (list.length === 0) {
    rowsContainer.innerHTML = `
      <div class="empty-state" style="padding:28px 12px">
        <div class="empty-state-icon">🔍</div>
        <div class="empty-state-title">Tidak ada pengguna yang sesuai</div>
        <div class="empty-state-text">Coba periksa kembali kata kunci pencarian atau reset filter peran/kelas.</div>
        <button type="button" onclick="resetUserFilters()" class="btn btn-sm btn-outline mt-3">Reset Filter</button>
      </div>
    `;
    return;
  }

  rowsContainer.innerHTML = list.map(u => {
    if (u.role === 'siswa') {
      const absenVal = (u.noAbsen || u.no_absen || '').trim();
      const hasAbsen = Boolean(absenVal);
      const displayAbsen = hasAbsen ? absenVal : '-';
      return `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:8px;background:#fff;transition:all 0.15s">
          <div style="min-width:44px;height:44px;border-radius:var(--radius);background:${hasAbsen ? 'var(--primary-pale)' : '#FEE2E2'};color:${hasAbsen ? 'var(--primary)' : 'var(--danger)'};display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;border:1px solid ${hasAbsen ? 'var(--primary-light)' : '#FECACA'}" title="${hasAbsen ? 'Nomor Absen ' + Utils.escapeHtml(displayAbsen) : 'Nomor Absen belum diisi'}">
            <span style="font-size:8.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray-500);font-weight:700">ABSEN</span>
            <span style="font-size:14px;line-height:1.1">${Utils.escapeHtml(displayAbsen)}</span>
          </div>

          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-size:13.5px;font-weight:700;color:var(--gray-900)">${Utils.escapeHtml(u.name)}</span>
              <span class="badge ${u.kelas ? 'badge-primary' : 'badge-warning'}" style="font-size:10.5px">
                🏛️ ${u.kelas ? 'Kelas ' + Utils.escapeHtml(u.kelas) : 'Belum Ada Kelas'}
              </span>
              ${!hasAbsen ? '<span class="badge badge-danger" style="font-size:10px">⚠️ Absen Belum Diisi</span>' : ''}
            </div>
            <div style="font-size:11.5px;color:var(--gray-500);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">

async function saveUser(e) {
  e.preventDefault();
  if (session.role !== 'admin') {
    Utils.toast('Hanya Administrator yang memiliki hak membuat atau mengedit akun', 'error');
    return;
  }
  const name = Utils.sanitizeInput(document.getElementById('nu-name').value);
  const username = Utils.sanitizeInput(document.getElementById('nu-username').value);
  const password = document.getElementById('nu-password').value;
  const hiddenRole = document.getElementById('nu-role-hidden')?.value;
  const role = hiddenRole || document.getElementById('nu-role').value;
  const kelas = role === 'siswa' ? Utils.sanitizeInput(document.getElementById('nu-kelas')?.value || '') : '';
  const noAbsen = role === 'siswa' ? Utils.sanitizeInput(document.getElementById('nu-no-absen')?.value || '') : '';
  const mapel = role === 'guru' ? Utils.sanitizeInput(document.getElementById('nu-mapel')?.value || '') : '';
  const kelasAmpu = role === 'guru' ? Utils.sanitizeInput(document.getElementById('nu-kelas-ampu')?.value || '') : '';
  
  if (!name || !username) { Utils.toast('Nama dan username wajib diisi', 'error'); return; }
  
  if (!editingUserId) {
    if (!password) { Utils.toast('Password wajib diisi untuk pengguna baru', 'error'); return; }
    if (password.length < 4) { Utils.toast('Password minimal 4 karakter', 'error'); return; }
    const existing = DB.getUsers().find(u => u.username === username);
    if (existing) { Utils.toast('Username sudah digunakan', 'error'); return; }

    await DB.addUser({
      name,
      username,
      password,
      role,
      kelas,
      noAbsen,
      no_absen: noAbsen,
      mapel,
      kelasAmpu,
      active: true
    });
    Utils.toast(`Akun ${role.toUpperCase()} "${name}" berhasil dibuat`, 'success');
  } else {
    const existing = (DB.getUserById ? DB.getUserById(editingUserId) : null) || DB.getUsers().find(u => u.id === editingUserId);
    const updateData = {
      name,
      username: existing?.username || username,
      role,
      kelas,
      noAbsen,
      no_absen: noAbsen,
      mapel,
      kelasAmpu
    };
    if (password && password.trim()) {
      if (password.length < 4) {
        Utils.toast('Password baru minimal 4 karakter jika ingin diubah', 'error');
        return;
      }
      updateData.password = password;
    }
    await DB.updateUser(editingUserId, updateData);
    if (session && editingUserId === session.userId) {
      Auth.updateSession({ name, role, kelas, noAbsen, no_absen: noAbsen, mapel, kelasAmpu });
    }
    Utils.toast(`Akun "${name}" berhasil diperbarui`, 'success');
  }

  closeUserModal();
  renderUserList();
}

function handleSiswaFileSelect(event) {
  const file = event.target.files ? event.target.files[0] : (event.dataTransfer ? event.dataTransfer.files[0] : null);
  if (!file) return;

  // Validasi ekstensi: hanya izinkan format spreadsheet yang aman
  const allowedExtensions = ['.xlsx', '.xls', '.csv'];
  const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
  if (!allowedExtensions.includes(ext)) {
    Utils.toast('Hanya file Excel (.xlsx, .xls) atau CSV (.csv) yang diperbolehkan! Format lain ditolak demi keamanan.', 'error');
    if (event.target && event.target.value) event.target.value = '';
    return;
  }

  // Batas ukuran file (maks 10 MB)
  if (file.size > 10 * 1024 * 1024) {
    Utils.toast('Ukuran file terlalu besar! Maksimal 10 MB.', 'warning');
    if (event.target && event.target.value) event.target.value = '';
    return;
  }

  const reader = new FileReader();
  const isExcel = ext === '.xlsx' || ext === '.xls';

  if (isExcel && typeof XLSX !== 'undefined') {
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
        processParsedSiswaData(json, file.name);
      } catch (err) {
        console.error('Error parsing excel:', err);
        Utils.toast('Gagal membaca file Excel: ' + err.message, 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        let rows = [];
        if (typeof XLSX !== 'undefined') {
          const workbook = XLSX.read(text, { type: 'string' });
          rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });
        } else {
          rows = parseCSVToObjects(text);
        }
        processParsedSiswaData(rows, file.name);
      } catch (err) {
        Utils.toast('Gagal membaca file CSV: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  }
}

function parseCSVToObjects(text) {
  const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.replace(/^["']|["']$/g, '').trim());
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.replace(/^["']|["']$/g, '').trim());
    const obj = {};
    headers.forEach((h, idx) => {
      obj[h] = cols[idx] !== undefined ? cols[idx] : '';
    });
    result.push(obj);
  }
  return result;
}

function processParsedSiswaData(rawRows, fileName) {
  if (!Array.isArray(rawRows) || rawRows.length === 0) {
    Utils.toast('File kosong atau tidak memiliki baris data', 'error');
    return;
  }

  const findVal = (row, aliases) => {
    const keys = Object.keys(row);
    for (const a of aliases) {
      const match = keys.find(k => k.trim().toLowerCase() === a.toLowerCase() || k.trim().toLowerCase().includes(a.toLowerCase()));
      if (match && row[match] !== undefined && String(row[match]).trim() !== '') {
        return String(row[match]).trim();
      }
    }
    return '';
  };

  parsedSiswaBatch = [];
  for (let i = 0; i < rawRows.length; i++) {
    const row = rawRows[i];
    const username = findVal(row, ['username', 'nis', 'nisn', 'no induk', 'nomor induk', 'id']);
    const name = findVal(row, ['nama lengkap', 'nama siswa', 'nama', 'name']);
    const password = findVal(row, ['password', 'pin', 'pass', 'kata sandi']) || '12345';
    const kelas = findVal(row, ['kelas', 'class', 'rombel', 'tingkat']);
    const noAbsen = findVal(row, ['no absen', 'absen', 'nomor absen', 'no urut']);

    if (username && name) {
      parsedSiswaBatch.push({
        username,
        name,
        password,
        kelas,
        noAbsen,
        no_absen: noAbsen,
        role: 'siswa',
        active: true
      });
    }
  }

  if (parsedSiswaBatch.length === 0) {
    Utils.toast('Kolom NIS/Username dan Nama Siswa tidak terdeteksi dalam file', 'error');
    return;
  }

  // Tampilkan preview UI
  document.getElementById('drop-zone-siswa').style.display = 'none';
  document.getElementById('import-preview-container').style.display = 'block';
  document.getElementById('import-summary-text').textContent = `${parsedSiswaBatch.length} Akun Siswa Siap Diimpor`;
  document.getElementById('import-file-badge').textContent = fileName;
  document.getElementById('btn-submit-import').innerHTML = `🚀 Impor ${parsedSiswaBatch.length} Akun Siswa Sekarang`;

  const tbody = document.getElementById('import-preview-tbody');
  const previewSlice = parsedSiswaBatch.slice(0, 8);
  tbody.innerHTML = previewSlice.map((s, idx) => `
    <tr style="border-bottom:1px solid var(--gray-100)">
      <td style="padding:8px 12px;color:var(--gray-500)">${idx + 1}</td>
      <td style="padding:8px 12px;font-weight:700;color:var(--primary)">${Utils.escapeHtml(s.username)}</td>
      <td style="padding:8px 12px;font-weight:600;color:var(--gray-800)">${Utils.escapeHtml(s.name)}</td>
      <td style="padding:8px 12px"><span class="badge badge-gray">${Utils.escapeHtml(s.kelas || '-')}</span></td>
      <td style="padding:8px 12px">${Utils.escapeHtml(s.noAbsen || '-')}</td>
      <td style="padding:8px 12px;color:var(--gray-500);font-family:monospace">${Utils.escapeHtml(s.password)}</td>
    </tr>
  `).join('');

  if (parsedSiswaBatch.length > 8) {
    tbody.innerHTML += `
      <tr>
        <td colspan="6" style="padding:8px 12px;text-align:center;color:var(--gray-500);font-style:italic">
          ... dan ${parsedSiswaBatch.length - 8} siswa lainnya
        </td>
      </tr>`;
  }
}

async function startBatchImportSiswa() {
  if (parsedSiswaBatch.length === 0) {
    Utils.toast('Tidak ada data siswa untuk diimpor', 'error');
    return;
  }

  const btnSubmit = document.getElementById('btn-submit-import');
  const progressBox = document.getElementById('import-progress-box');
  const progressBar = document.getElementById('import-progress-bar');
  const progressPercent = document.getElementById('import-progress-percent');
  const progressStatus = document.getElementById('import-progress-status');

  btnSubmit.disabled = true;
  progressBox.style.display = 'block';

  try {
    const res = await DB.addUsersBatch(parsedSiswaBatch, (current, total) => {
      const pct = Math.round((current / total) * 100);
      progressBar.style.width = pct + '%';
      progressPercent.textContent = pct + '%';
      progressStatus.textContent = `Menyimpan ${current} dari ${total} siswa ke Supabase Cloud...`;
    });

    progressBar.style.width = '100%';
    progressPercent.textContent = '100%';
    progressStatus.textContent = `Selesai!`;

    Utils.toast(`✅ Berhasil mengimpor ${res.inserted} siswa baru dan memperbarui ${res.updated} siswa!`, 'success');
    setTimeout(() => {
      closeImportSiswaModal();
      renderPengaturan();
    }, 1200);
  } catch (err) {
    console.error('Batch import error:', err);
    Utils.toast('Terjadi kendala saat impor: ' + err.message, 'error');
    btnSubmit.disabled = false;
  }
}

document.addEventListener('click', e => {
  if (e.target === document.getElementById('modal-add-user')) closeUserModal();
  if (e.target === document.getElementById('modal-sql')) closeSqlModal();
  if (e.target === document.getElementById('modal-import-siswa')) closeImportSiswaModal();
});
