<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  
  <!-- Clipboard / Exam Sheet -->
  <g filter="url(#shadow)">
    <!-- Main Paper Sheet -->
    <rect x="14" y="12" width="36" height="42" rx="5" fill="url(#paper)"/>
    
    <!-- Top Clip -->
    <rect x="23" y="9" width="18" height="6" rx="3" fill="#0F172A"/>
    <circle cx="32" cy="12" r="1.5" fill="#94A3B8"/>
    
    <!-- Lines of Exam Questions -->
    <rect x="20" y="21" width="16" height="3" rx="1.5" fill="#2563EB"/>
    <rect x="20" y="27" width="24" height="2.5" rx="1.2" fill="#94A3B8"/>
    <rect x="20" y="32" width="20" height="2.5" rx="1.2" fill="#CBD5E1"/>
    
    <!-- Verified / Checkmark Badge -->
    <circle cx="39" cy="41" r="9" fill="url(#accent)"/>
    <path d="M35 41 L37.5 43.5 L43 38" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
