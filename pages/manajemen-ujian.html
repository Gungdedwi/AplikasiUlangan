<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Ujian - Ulangan Digital</title>
  <link rel="stylesheet" href="../css/style.css?v=2.2"/>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/storage.js?v=2.2"></script>
<script src="../js/utils.js?v=2.2"></script>
<script src="../js/auth.js?v=2.2"></script>
<script src="../js/layout.js?v=2.2"></script>
<script>
DB.init();
Auth.init();
const session = Layout.initStaff('manajemen-ujian', ['admin', 'guru']);
let editingUjianId = null;

const myMapels = DB.getGuruMapels(session);
const myKelas = DB.getGuruKelas(session);

function getTeacherUjian() {
  return DB.getUjian().filter(u => {
    if (!u) return false;
    if (session.role === 'admin') return true;
    return DB.isGuruMatch(session, u.mapel, u.kelas) || u.guruId === session.userId;
  });
}

try {
  if (session) renderManajemenUjian();
} catch (err) {
  console.error('Error rendering Manajemen Ujian:', err);
  Layout.setContent(`
    <div class="alert alert-danger" style="margin:24px">
      <span class="alert-icon">❌</span>
      <div><strong>Gagal memuat Manajemen Ujian:</strong> ${Utils.escapeHtml(err.message)}</div>
    </div>
  `);
}

// Sinkronkan data ujian terbaru dari Supabase Cloud
if (DB.client) {
  DB.syncFromSupabase().then(() => {
    if (session) renderManajemenUjian();
  });
}
window.addEventListener('supabase-synced', () => {
  if (session) renderManajemenUjian();
});

function renderManajemenUjian() {
  Layout.setPageTitle('Manajemen Ujian');
  const ujianList = getTeacherUjian();

  const content = `
  <div class="animate-fade-in">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="page-title">Manajemen Ujian</h1>
        <p class="page-subtitle">
          ${session.role === 'guru'
            ? `Mapel: <strong style="color:var(--primary)">${myMapels.join(', ') || 'Semua'}</strong> • Kelas Ampuan: <strong>${myKelas.join(', ') || 'Semua'}</strong>`
            : 'Buat dan kelola seluruh jadwal ujian (Akses Administrator)'}
        </p>
      </div>
      <button onclick="openUjianModal()" class="btn btn-primary">➕ Buat Ujian Baru</button>
    </div>

    <!-- Stats mini -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
      ${[
        {label:'Total', val:ujianList.length, color:'var(--primary)'},
        {label:'Aktif', val:ujianList.filter(u=>Utils.isUjianAktif(u)).length, color:'var(--success)'},
        {label:'Draft', val:ujianList.filter(u=>u.status==='draft').length, color:'var(--warning)'},
        {label:'Selesai', val:ujianList.filter(u=>Utils.isUjianSelesai(u)).length, color:'var(--gray-400)'},
      ].map(s => `
      <div style="background:white;border:1px solid var(--gray-200);border-radius:var(--radius);padding:12px 20px;display:flex;align-items:center;gap:10px">
        <span style="font-size:22px;font-weight:800;color:${s.color}">${s.val}</span>
        <span style="font-size:12px;color:var(--gray-500);font-weight:600">${s.label}</span>
      </div>`).join('')}
    </div>

    <!-- Ujian List -->
    <div id="ujian-list-container"></div>
  </div>

  <!-- Modal Ujian -->
  <div id="modal-ujian" class="modal-backdrop" style="display:none">
    <div class="modal modal-xl">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-ujian-title">Buat Ujian Baru</h3>
        <button class="modal-close" onclick="closeUjianModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-ujian-body"></div>
    </div>
  </div>`;

  Layout.setContent(content);
  renderUjianList();
}

function renderUjianList() {
  const ujianList = getTeacherUjian().sort((a,b) => b.createdAt - a.createdAt);
  const container = document.getElementById('ujian-list-container');
  if (!container) return;

  if (ujianList.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div class="empty-state-title">Belum ada ujian</div>
        <div class="empty-state-text">Klik "Buat Ujian Baru" untuk membuat ujian pertama</div>
      </div>`;
    return;
  }

  container.innerHTML = ujianList.map(u => {
    const hasil = DB.getHasilByUjian(u.id);
    const isAktif = Utils.isUjianAktif(u);
    const isBelumMulai = Utils.isUjianBelumMulai(u);
    const isSelesai = Utils.isUjianSelesai(u);
    
    let statusBadge = '';
    if (u.status === 'draft') statusBadge = '<span class="badge badge-gray">📝 Draft</span>';
    else if (isAktif) statusBadge = '<span class="badge badge-success">🟢 Aktif</span>';
    else if (isBelumMulai) statusBadge = '<span class="badge badge-info">⏳ Belum Mulai</span>';
    else if (isSelesai) statusBadge = '<span class="badge badge-warning">✓ Selesai</span>';
    else statusBadge = '<span class="badge badge-gray">⏸️ Nonaktif</span>';

    const avgNilai = hasil.filter(h=>h.nilai!==null).length > 0
      ? (hasil.reduce((a,b) => a+(b.nilai||0), 0) / hasil.filter(h=>h.nilai!==null).length).toFixed(1)
      : '-';

    return `
    <div class="card mb-4">
      <div style="display:flex;gap:16px;align-items:flex-start">
        <div style="width:52px;height:52px;background:var(--primary-pale);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">📋</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div>
              <h3 style="font-size:16px;font-weight:700;color:var(--gray-900);margin-bottom:4px">${Utils.escapeHtml(u.judul)}</h3>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
                ${statusBadge}
                <span class="badge badge-primary">📚 ${Utils.escapeHtml(u.mapel)}</span>
                <span class="badge badge-gray">👥 ${Utils.escapeHtml(u.kelas)}</span>
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button onclick="openUjianModal('${u.id}')" class="btn btn-sm btn-outline">✏️ Edit</button>
              <button onclick="toggleStatus('${u.id}')" class="btn btn-sm ${isAktif || u.status === 'aktif' ? 'btn-warning' : 'btn-success'}">${isAktif || u.status === 'aktif' ? '⏸️ Nonaktifkan' : '▶️ Aktifkan'}</button>
              <a href="hasil.html?ujianId=${u.id}" class="btn btn-sm btn-secondary">📊 Hasil</a>
              <button onclick="hapusUjian('${u.id}')" class="btn btn-sm btn-danger">🗑️</button>
            </div>
          </div>

          <!-- Info Grid -->
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;background:var(--gray-50);border-radius:var(--radius);padding:14px;border:1px solid var(--gray-200)">
            <div>
              <div style="font-size:11px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Kode Ujian</div>
              <div style="font-size:20px;font-weight:800;color:var(--primary);letter-spacing:2px;font-family:monospace">${u.kode}</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Durasi</div>
              <div style="font-size:16px;font-weight:700;color:var(--gray-800)">${u.durasi} menit</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Jumlah Soal</div>
              <div style="font-size:16px;font-weight:700;color:var(--gray-800)">${u.soalIds?.length || 0} soal</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">KKM</div>
              <div style="font-size:16px;font-weight:700;color:var(--gray-800)">${u.kkm || 75}</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Peserta</div>
              <div style="font-size:16px;font-weight:700;color:var(--gray-800)">${hasil.length} siswa</div>
            </div>
            <div>
              <div style="font-size:11px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Rata-rata</div>
              <div style="font-size:16px;font-weight:700;color:${parseFloat(avgNilai) >= (u.kkm||75) ? 'var(--success)' : 'var(--danger)'}">${avgNilai}</div>
            </div>
          </div>

          <!-- Jadwal -->
          <div style="display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--gray-500);flex-wrap:wrap">
            ${u.jadwalMulai ? `<span>📅 Mulai: <strong>${Utils.formatDateTime(new Date(u.jadwalMulai).getTime())}</strong></span>` : ''}
            ${u.jadwalSelesai ? `<span>📅 Selesai: <strong>${Utils.formatDateTime(new Date(u.jadwalSelesai).getTime())}</strong></span>` : ''}
            <span>⚠️ Maks. Pelanggaran: <strong>${u.maxPelanggaran || 3}x</strong></span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openUjianModal(id = null) {
  editingUjianId = id;
  const ujian = id ? DB.getUjianById(id) : null;
  const soalList = DB.getSoal().filter(s => {
    if (!s) return false;
    if (session.role === 'admin') return true;
    return DB.isGuruMatch(session, s.mapel, s.kelas) || s.pembuatId === session.userId;
  });
  document.getElementById('modal-ujian-title').textContent = id ? 'Edit Ujian' : 'Buat Ujian Baru';
  document.getElementById('modal-ujian-body').innerHTML = buildUjianForm(ujian, soalList);
  document.getElementById('modal-ujian').style.display = 'flex';
  updateSelectedSoal();
}

function closeUjianModal() {
  document.getElementById('modal-ujian').style.display = 'none';
  editingUjianId = null;
}

function buildUjianForm(ujian, soalList) {
  const now = new Date();
  const nowStr = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,16);
  const endStr = new Date(now.getTime() - now.getTimezoneOffset() * 60000 + 7200000).toISOString().slice(0,16);

  const tipeBadge = {pg:'PG', bs:'B/S', isian:'Isian', uraian:'Uraian'};
  const defaultMapel = ujian?.mapel || (myMapels[0] || '');
  const defaultKelas = ujian?.kelas || (myKelas[0] || '');
  
  return `
  <form onsubmit="saveUjian(event)" novalidate>
    <h4 style="font-family:var(--font-heading);font-size:14px;font-weight:700;color:var(--gray-700);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px">📋 Informasi Ujian</h4>
    <div class="form-row">
      <div class="form-group" style="grid-column:1/-1">
        <label class="form-label">Judul Ujian <span class="required">*</span></label>
        <input type="text" id="u-judul" class="form-control" value="${Utils.escapeHtml(ujian?.judul||'')}" placeholder="e.g. Ujian Matematika Semester 1" maxlength="200"/>
      </div>
      <div class="form-group">
        <label class="form-label">Mata Pelajaran <span class="required">*</span></label>
        ${myMapels.length > 0 ? `
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">
          ${myMapels.map(m => `<button type="button" class="btn btn-ghost btn-xs" style="border:1px solid var(--gray-300);padding:1px 6px;font-size:10px" onclick="document.getElementById('u-mapel').value='${m}'">${m}</button>`).join('')}
        </div>` : ''}
        <input type="text" id="u-mapel" class="form-control" value="${Utils.escapeHtml(defaultMapel)}" placeholder="e.g. Matematika" maxlength="100"/>
      </div>
      <div class="form-group">
        <label class="form-label">Kelas</label>
        ${myKelas.length > 0 ? `
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">
          ${myKelas.map(k => `<button type="button" class="btn btn-ghost btn-xs" style="border:1px solid var(--gray-300);padding:1px 6px;font-size:10px" onclick="document.getElementById('u-kelas').value='${k}'">${k}</button>`).join('')}
        </div>` : ''}
        <input type="text" id="u-kelas" class="form-control" value="${Utils.escapeHtml(defaultKelas)}" placeholder="e.g. XI IPA 1" maxlength="100"/>
      </div>
    </div>

    <h4 style="font-family:var(--font-heading);font-size:14px;font-weight:700;color:var(--gray-700);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px">⚙️ Pengaturan Ujian</h4>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Durasi (menit) <span class="required">*</span></label>
        <input type="number" id="u-durasi" class="form-control" value="${ujian?.durasi||90}" min="5" max="480"/>
      </div>
      <div class="form-group">
        <label class="form-label">KKM</label>
        <input type="number" id="u-kkm" class="form-control" value="${ujian?.kkm||75}" min="0" max="100"/>
      </div>
      <div class="form-group">
        <label class="form-label">Maks. Pelanggaran</label>
        <input type="number" id="u-max-pelanggaran" class="form-control" value="${ujian?.maxPelanggaran||3}" min="1" max="20"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Jadwal Mulai</label>
        <input type="datetime-local" id="u-jadwal-mulai" class="form-control" value="${ujian?.jadwalMulai ? new Date(new Date(ujian.jadwalMulai).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : nowStr}"/>
      </div>
      <div class="form-group">
        <label class="form-label">Jadwal Selesai</label>
        <input type="datetime-local" id="u-jadwal-selesai" class="form-control" value="${ujian?.jadwalSelesai ? new Date(new Date(ujian.jadwalSelesai).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : endStr}"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Instruksi untuk Siswa</label>
      <textarea id="u-instruksi" class="form-control" rows="3" placeholder="Tuliskan instruksi ujian..." maxlength="2000">${Utils.escapeHtml(ujian?.instruksi||'Kerjakan soal dengan teliti dan jujur. Dilarang bekerjasama. Periksa kembali jawaban sebelum mengirim.')}</textarea>
    </div>
    
    <!-- Opsi -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <label class="toggle-switch">
        <div class="toggle-track ${ujian?.acakSoal!==false?'on':''}" id="toggle-acak-soal" onclick="this.classList.toggle('on');this.querySelector('.toggle-thumb').style.left=this.classList.contains('on')?'22px':'2px'"><div class="toggle-thumb" style="left:${ujian?.acakSoal!==false?'22':'2'}px"></div></div>
        <span class="toggle-label">Acak urutan soal</span>
      </label>
      <label class="toggle-switch">
        <div class="toggle-track ${ujian?.tampilkanHasil?'on':''}" id="toggle-tampilkan-hasil" onclick="this.classList.toggle('on');this.querySelector('.toggle-thumb').style.left=this.classList.contains('on')?'22px':'2px'"><div class="toggle-thumb" style="left:${ujian?.tampilkanHasil?'22':'2'}px"></div></div>
        <span class="toggle-label">Tampilkan hasil langsung</span>
      </label>
    </div>

    <h4 style="font-family:var(--font-heading);font-size:14px;font-weight:700;color:var(--gray-700);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px">📚 Pilih Soal</h4>
    <div style="font-size:13px;color:var(--gray-500);margin-bottom:10px">Pilih soal yang akan dimasukkan ke ujian. Soal yang dipilih: <strong id="selected-count">0</strong></div>
    
    ${soalList.length === 0 ? `
    <div class="alert alert-warning"><span class="alert-icon">⚠️</span>Belum ada soal di bank soal. <a href="bank-soal.html" style="color:var(--primary)">Tambahkan soal terlebih dahulu</a></div>
    ` : `
    <div style="max-height:300px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:var(--radius)">
      ${soalList.map((s,i) => {
        const isSelected = ujian?.soalIds?.includes(s.id) !== false;
        const checked = ujian ? ujian?.soalIds?.includes(s.id) : true;
        return `
        <label style="display:flex;align-items:flex-start;gap:12px;padding:12px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background 0.15s" onmouseover="this.style.background='var(--gray-50)'" onmouseout="this.style.background='white'">
          <input type="checkbox" id="soal-check-${s.id}" name="soal-ids" value="${s.id}" ${checked?'checked':''} onchange="updateSelectedSoal()" style="margin-top:3px;width:16px;height:16px;cursor:pointer"/>
          <div style="flex:1">
            <div style="display:flex;gap:6px;margin-bottom:4px">
              <span class="badge badge-primary" style="font-size:10px">${tipeBadge[s.tipe]||s.tipe}</span>
              <span class="badge badge-gray" style="font-size:10px">${Utils.escapeHtml(s.bab||s.mapel||'-')}</span>
              <span class="badge badge-gray" style="font-size:10px">Bobot: ${s.bobot||1}</span>
            </div>
            <div style="font-size:13px;color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${Utils.escapeHtml(s.pertanyaan)}</div>
          </div>
        </label>`;
      }).join('')}
    </div>`}

    <div class="modal-footer" style="padding:0;border:none;margin-top:20px">
      <button type="button" onclick="closeUjianModal()" class="btn btn-secondary">Batal</button>
      <button type="submit" class="btn btn-primary">💾 Simpan Ujian</button>
    </div>
  </form>`;
}

function updateSelectedSoal() {
  const checked = document.querySelectorAll('input[name="soal-ids"]:checked');
  const el = document.getElementById('selected-count');
  if (el) el.textContent = checked.length;
}

function saveUjian(e) {
  e.preventDefault();
  const judul = Utils.sanitizeInput(document.getElementById('u-judul').value);
  const mapel = Utils.sanitizeInput(document.getElementById('u-mapel').value);
  if (!judul) { Utils.toast('Judul ujian wajib diisi', 'error'); return; }
  if (!mapel) { Utils.toast('Mata pelajaran wajib diisi', 'error'); return; }

  const soalIds = [...document.querySelectorAll('input[name="soal-ids"]:checked')].map(el => el.value);
  if (soalIds.length === 0) { Utils.toast('Pilih minimal 1 soal', 'error'); return; }

  const jadwalMulaiEl = document.getElementById('u-jadwal-mulai').value;
  const jadwalSelesaiEl = document.getElementById('u-jadwal-selesai').value;

  const data = {
    judul,
    mapel,
    kelas: Utils.sanitizeInput(document.getElementById('u-kelas').value),
    durasi: parseInt(document.getElementById('u-durasi').value) || 90,
    kkm: parseInt(document.getElementById('u-kkm').value) || 75,
    maxPelanggaran: parseInt(document.getElementById('u-max-pelanggaran').value) || 3,
    jadwalMulai: jadwalMulaiEl ? new Date(jadwalMulaiEl).toISOString() : null,
    jadwalSelesai: jadwalSelesaiEl ? new Date(jadwalSelesaiEl).toISOString() : null,
    instruksi: Utils.sanitizeInput(document.getElementById('u-instruksi').value),
    acakSoal: document.getElementById('toggle-acak-soal').classList.contains('on'),
    tampilkanHasil: document.getElementById('toggle-tampilkan-hasil').classList.contains('on'),
    soalIds,
    jumlahSoal: soalIds.length,
    guru: session.name,
    guruId: session.userId,
  };

  if (editingUjianId) {
    DB.updateUjian(editingUjianId, data);
    Utils.toast('Ujian berhasil diperbarui', 'success');
  } else {
    DB.addUjian(data);
    Utils.toast('Ujian berhasil dibuat', 'success');
  }
  closeUjianModal();
  renderUjianList();
}

function toggleStatus(id) {
  const ujian = DB.getUjianById(id);
  if (!ujian) return;
  const newStatus = ujian.status === 'aktif' ? 'nonaktif' : 'aktif';
  DB.updateUjian(id, { status: newStatus });
  Utils.toast(`Ujian berhasil ${newStatus === 'aktif' ? 'diaktifkan' : 'dinonaktifkan'}`, 'success');
  renderUjianList();
}

function hapusUjian(id) {
  Utils.confirm('Hapus Ujian', 'Yakin ingin menghapus ujian ini? Semua data hasil juga akan terhapus.', () => {
    DB.deleteUjian(id);
    Utils.toast('Ujian berhasil dihapus', 'success');
    renderUjianList();
  });
}

document.addEventListener('click', e => {
  const modal = document.getElementById('modal-ujian');
  if (modal && e.target === modal) closeUjianModal();
});
</script>
</body>
</html>
