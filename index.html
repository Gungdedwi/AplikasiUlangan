<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Aplikasi Ulangan Digital - Portal Login Siswa untuk Asesmen Online"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta http-equiv="X-Frame-Options" content="DENY"/>
  <title>Login Siswa - Ulangan Digital</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="toast-container"></div>

<div class="login-page">
  <div class="login-bg-circles">
    <span></span><span></span><span></span>
  </div>

  <div class="login-card animate-fade-in-up">
    <div class="login-header">
      <div class="login-logo">🎓</div>
      <h1 class="login-title">Portal Siswa</h1>
      <p class="login-subtitle">Sistem Asesmen Online Ulangan Digital</p>
    </div>

    <div class="login-body">
      <!-- Alert Error -->
      <div id="login-error" class="alert alert-danger" style="display:none">
        <span class="alert-icon">❌</span>
        <span id="login-error-msg">Login gagal</span>
      </div>

      <!-- Form Siswa -->
      <form onsubmit="doLogin(event)" novalidate>
        <div class="form-group">
          <label class="form-label">Username / NIS Siswa <span class="required">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon">🎓</span>
            <input type="text" id="siswa-username" class="form-control" placeholder="Masukkan username atau NIS" autocomplete="username" maxlength="50"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">PIN / Password <span class="required">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" id="siswa-password" class="form-control" placeholder="Masukkan PIN atau password" autocomplete="current-password" maxlength="100"/>
            <button type="button" class="input-action" onclick="togglePassword('siswa-password')">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="btn-siswa-login">
          <span id="btn-siswa-text">Masuk sebagai Siswa</span>
          <span id="btn-siswa-loading" class="spinner spinner-sm" style="display:none"></span>
        </button>
      </form>

      <div class="divider" style="margin:20px 0"></div>

      <div style="text-align:center">
        <p style="font-size:13px;color:var(--gray-600);margin-bottom:8px">Bukan siswa? Pendidik atau Staf Sekolah:</p>
        <a href="pages/login-guru.html" class="btn btn-outline btn-full btn-sm" style="font-weight:600">
          👨‍🏫 Masuk sebagai Guru & Administrator →
        </a>
      </div>

      <div class="divider" style="margin:20px 0"></div>
      <p class="text-center text-xs text-muted">
        🔒 Sistem asesmen digital aman & terlindungi<br/>
        <strong>SMA Negeri Contoh</strong> • TA 2025/2026
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/storage.js?v=2.3"></script>
<script src="js/utils.js?v=2.3"></script>
<script src="js/auth.js?v=2.3"></script>
<script>
  // Inisialisasi
  DB.init();
  Auth.init();

  // Redirect jika sudah memiliki sesi aktif
  const session = Auth.getSession();
  if (session) {
    if (session.role === 'siswa') {
      window.location.href = 'pages/dashboard-siswa.html';
    } else {
      window.location.href = 'pages/dashboard-guru.html';
    }
  }

  function hideError() {
    document.getElementById('login-error').style.display = 'none';
  }

  function showError(msg) {
    document.getElementById('login-error').style.display = 'flex';
    document.getElementById('login-error-msg').textContent = msg;
  }

  function togglePassword(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  function setLoading(loading) {
    document.getElementById('btn-siswa-text').style.display = loading ? 'none' : 'inline';
    document.getElementById('btn-siswa-loading').style.display = loading ? 'inline-block' : 'none';
    document.getElementById('btn-siswa-login').disabled = loading;
  }

  async function doLogin(e) {
    e.preventDefault();
    hideError();
    Utils.clearFieldErrors();

    const username = document.getElementById('siswa-username').value;
    const password = document.getElementById('siswa-password').value;

    if (!username.trim()) { showError('Username / NIS harus diisi'); return; }
    if (!password.trim()) { showError('PIN / Password harus diisi'); return; }

    setLoading(true);

    try {
      const result = await Auth.login(username, password, 'siswa');

      if (!result.success) {
        showError(result.error);
        document.getElementById('siswa-password').value = '';
        return;
      }

      Utils.toast(`Selamat datang, ${result.user.name}!`, 'success');
      setTimeout(() => {
        window.location.href = 'pages/dashboard-siswa.html';
      }, 300);
    } catch (err) {
      console.error('Login error:', err);
      showError('Gagal masuk ke sistem: ' + (err.message || 'Silakan periksa koneksi Anda.'));
    } finally {
      setLoading(false);
    }
  }
</script>
</body>
</html>
